<style>

.novas{display:flex;gap:8px;flex-wrap:wrap}
.btn-nova{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:11px;font-size:12px;font-weight:700;border:1px solid var(--border-soft);background:var(--panel);transition:transform .15s,border-color .15s,background .15s}
.btn-nova:hover{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--panel))}.btn-nova:active{transform:scale(.96)}

.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}

.pills{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--border-soft);border-radius:11px;background:var(--panel);flex-wrap:wrap}

.nota[data-cor=amarelo]{--nc:#f5c542}.nota[data-cor=verde]{--nc:#6fcf7f}.nota[data-cor=azul]{--nc:#5bc0eb}.nota[data-cor=rosa]{--nc:#f78fb3}
.nota[data-cor=laranja]{--nc:#f59e42}.nota[data-cor=roxo]{--nc:#b69cf0}.nota[data-cor=cinza]{--nc:#b0b7c3}
.nota .topo{display:flex;align-items:flex-start;gap:8px}

.nota .senha-lin{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:11.5px}.nota .senha-lin b{flex:0 0 52px;color:var(--muted);font-weight:600;font-size:10.5px}

.acoes button{width:26px;height:26px;border-radius:8px;font-size:13px;color:var(--muted)}.acoes button:hover{background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold-light)}

/* janelas */

.md[data-cor=amarelo]{--nc:#f5c542}.md[data-cor=verde]{--nc:#6fcf7f}.md[data-cor=azul]{--nc:#5bc0eb}.md[data-cor=rosa]{--nc:#f78fb3}.md[data-cor=laranja]{--nc:#f59e42}.md[data-cor=roxo]{--nc:#b69cf0}.md[data-cor=cinza]{--nc:#b0b7c3}
.md-cab{display:flex;align-items:center;gap:10px;padding:14px 16px 4px}
.md-cab input{flex:1;background:transparent;border:0;outline:0;font-size:17px;font-weight:700;min-width:0}

.linha{display:flex;gap:6px;align-items:center}.linha>input{flex:1}
.linha .mini{height:var(--altura-controle,38px);min-width:38px}
.itens{display:flex;flex-direction:column;gap:5px}
.item-ed{display:flex;align-items:center;gap:8px}.item-ed input[type=checkbox]{width:16px;height:16px;accent-color:var(--gold)}
.item-ed input[type=text]{flex:1;height:34px;border:0;border-bottom:1px solid var(--border-soft);border-radius:0;background:transparent;padding:0 4px;font-size:12.5px;outline:0}
.item-ed input[type=text]:focus{border-bottom-color:var(--gold)}.item-ed.ok input[type=text]{text-decoration:line-through;color:var(--muted)}
.item-ed button{color:var(--muted);width:24px;height:24px}
.cores{display:flex;gap:7px;flex-wrap:wrap}
.cores button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;background:var(--c);transition:transform .15s}.cores button:hover{transform:scale(1.15)}.cores button.on{border-color:var(--text)}
.cores button[data-cor=padrao]{background:var(--panel-solid);border:2px solid var(--border-soft)}.cores button[data-cor=padrao].on{border-color:var(--text)}
.etq-ed{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.etq-ed .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;border-radius:10px;padding:2px 4px 2px 10px;background:color-mix(in srgb,var(--text) 9%,transparent)}.etq-ed .chip button{width:18px;height:18px;color:var(--muted)}
.etq-ed input{flex:1;min-width:130px;height:30px;border:0;border-bottom:1px solid var(--border-soft);background:transparent;font-size:12px;outline:0}
.aviso-senha{font-size:11px;color:var(--muted);border-radius:9px;padding:8px 10px;background:color-mix(in srgb,var(--warning) 10%,transparent);border:1px solid color-mix(in srgb,var(--warning) 30%,transparent)}
.md-rod{display:flex;gap:8px;align-items:center;padding:10px 16px 14px;flex-wrap:wrap}
.md-rod .esq{display:flex;gap:6px;flex-wrap:wrap}.md-rod .dir{margin-left:auto;display:flex;gap:8px}
.btn{height:36px;padding:0 16px;border-radius:10px;font-size:12px;font-weight:700;border:1px solid var(--border-soft)}.btn:hover{border-color:var(--gold)}
.btn.prim{background:var(--gold);border-color:var(--gold);color:#fff}.btn.perigo{color:var(--danger)}.btn[disabled]{opacity:.55;cursor:default}
.comp-lista{display:flex;flex-direction:column;gap:4px;max-height:320px;overflow-y:auto}
.comp-lin{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px}.comp-lin:hover{background:color-mix(in srgb,var(--gold) 8%,transparent)}
.comp-lin label{flex:1;display:flex;align-items:center;gap:9px;font-size:12.5px;cursor:pointer}.comp-lin input[type=checkbox]{width:16px;height:16px;accent-color:var(--gold)}
.comp-lin select{height:28px;border-radius:8px;border:1px solid var(--border-soft);background:var(--panel-solid);font-size:11px;padding:0 6px}
.somente-leitura-aviso{font-size:11px;color:var(--muted)}
@media(max-width:760px){.content{padding:18px 14px 34px}.page-head h1{font-size:27px}.grade{columns:1}.acoes{opacity:1}}
</style>

<script>

<script>
/* =====================================================================
   NOTAS (T105) · pessoais, com cores, fixar, arquivar, etiquetas, compartilhar com colegas
   Tipos: texto, lista (checklist) e senha (nome, login, senha, link, o que é).
   A senha fica criptografada no banco: só sai pela função nota_ver_senha (dono ou quem recebeu a nota).
   ===================================================================== */
var COLUNAS='id,dono_id,tipo,titulo,conteudo,itens,login,link,tem_senha,cor,fixada,arquivada,etiquetas,criado_em,atualizado_em';
var CORES=[['padrao','Sem cor'],['amarelo','Amarelo'],['verde','Verde'],['azul','Azul'],['rosa','Rosa'],['laranja','Laranja'],['roxo','Roxo'],['cinza','Cinza']];
var CORHEX={amarelo:'#f5c542',verde:'#6fcf7f',azul:'#5bc0eb',rosa:'#f78fb3',laranja:'#f59e42',roxo:'#b69cf0',cinza:'#b0b7c3'};
var TIPO_NOME={texto:'Nota',lista:'Lista',senha:'Senha'};
var S={eu:null,notas:[],comp:{},pessoas:{},filtro:'todas',etq:'',busca:'',aberta:null,ed:null};

function esc(v){var d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML;}
function toast(msg,tipo){var w=document.getElementById('toastWrap');var t=document.createElement('div');t.className='toast '+(tipo||'');t.innerHTML=msg;w.appendChild(t);setTimeout(function(){t.remove();},4500);}
function $(id){return document.getElementById(id);}
function puro(v){return window.SagaTexto?SagaTexto.puro(v||''):String(v||'').replace(/<[^>]*>/g,' ');}
function nomeDe(id){return (S.pessoas[id]||{}).nome_completo||'Colega';}
function primeiro(id){return String(nomeDe(id)).split(' ')[0];}
function ehMinha(n){return n.dono_id===S.eu;}
function podeEditar(n){return ehMinha(n)||((S.comp[n.id]||[]).some(function(c){return c.usuario_id===S.eu&&c.pode_editar;}));}
function compCom(n){return (S.comp[n.id]||[]).filter(function(c){return c.usuario_id!==S.eu;});}
function urlSegura(u){u=String(u||'').trim();if(!u)return '';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;return /^https?:\/\//i.test(u)?u:'';}
function copiar(texto,rotulo){
  var ok=function(){toast((rotulo||'Texto')+' copiado.','sucesso');};
  var antigo=function(){var t=document.createElement('textarea');t.value=texto;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();var deu=false;try{deu=document.execCommand('copy');}catch(e){}t.remove();if(deu)ok();else toast('Não foi possível copiar. Selecione e copie manualmente.','erro');};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(texto).then(ok,antigo);}else antigo();
}
async function pegarSenha(n){
  var r=await _sb.rpc('nota_ver_senha',{p_nota:n.id});
  if(r.error){toast('Não foi possível ler a senha: '+esc(r.error.message||''),'erro');return null;}
  return r.data||'';
}

/* ---------- carregar ---------- */
async function carregar(){
  var r=await Promise.all([
    _sb.from('notas').select(COLUNAS).order('atualizado_em',{ascending:false}).limit(1000),
    _sb.from('notas_compartilhadas').select('nota_id,usuario_id,pode_editar')
  ]);
  if(r[0].error){toast('Não foi possível carregar as notas: '+esc(r[0].error.message||''),'erro');return false;}
  S.notas=r[0].data||[];
  S.comp={};(r[1].data||[]).forEach(function(c){(S.comp[c.nota_id]=S.comp[c.nota_id]||[]).push(c);});
  return true;
}

/* ---------- filtros e lista ---------- */
function todasEtiquetas(){var m={};S.notas.filter(ehMinha).forEach(function(n){(n.etiquetas||[]).forEach(function(e){m[e]=(m[e]||0)+1;});});return Object.keys(m).sort(function(a,b){return a.localeCompare(b,'pt-BR');});}
function passa(n){
  var f=S.filtro;
  if(f==='arq'){if(!n.arquivada)return false;}
  else{if(n.arquivada)return false;if(f==='minhas'&&!ehMinha(n))return false;if(f==='comp'&&ehMinha(n))return false;}
  if(S.etq&&(n.etiquetas||[]).indexOf(S.etq)<0)return false;
  var q=S.busca.trim().toLowerCase();
  if(q){
    var alvo=[n.titulo,puro(n.conteudo),n.login,n.link,(n.etiquetas||[]).join(' '),(n.itens||[]).map(function(i){return i.texto;}).join(' ')].join(' ').toLowerCase();
    if(alvo.indexOf(q)<0)return false;
  }
  return true;
}
function desenharEtiquetas(){
  var l=todasEtiquetas(),box=$('etqs');
  if(S.etq&&l.indexOf(S.etq)<0)S.etq='';
  box.innerHTML=l.map(function(e){return '<button type="button" class="etq'+(S.etq===e?' ativa':'')+'" data-e="'+esc(e)+'">'+esc(e)+'</button>';}).join('');
}
function cartao(n){
  var corpo='';
  if(n.tipo==='texto'){corpo=n.conteudo?'<div class="corpo'+(puro(n.conteudo).length>260?' corta':'')+'">'+SagaTexto.html(n.conteudo)+'</div>':'';}
  else if(n.tipo==='lista'){
    var it=(n.itens||[]),abertos=it.filter(function(i){return !i.ok;}),feitos=it.filter(function(i){return i.ok;});
    var ordem=abertos.concat(feitos).slice(0,9);
    corpo='<div class="corpo'+(it.length>9?' corta':'')+'">'+ordem.map(function(i){var idx=it.indexOf(i);return '<label class="it'+(i.ok?' ok':'')+'"><input type="checkbox" data-it="'+idx+'"'+(i.ok?' checked':'')+(podeEditar(n)?'':' disabled')+'><span>'+esc(i.texto)+'</span></label>';}).join('')+(it.length>9?'<div class="it"><span style="color:var(--muted)">+ '+(it.length-9)+' itens</span></div>':'')+'</div>';
  }else{
    var u=urlSegura(n.link);
    corpo='<div class="corpo">'+
      (n.login?'<div class="senha-lin"><b>Login</b><span>'+esc(n.login)+'</span><button class="mini" type="button" data-cp="login" title="Copiar o login">Copiar</button></div>':'')+
      '<div class="senha-lin"><b>Senha</b><span>'+(n.tem_senha?'••••••••••':'<i style="color:var(--muted)">sem senha</i>')+'</span>'+(n.tem_senha?'<button class="mini" type="button" data-cp="senha" title="Copiar a senha">Copiar</button>':'')+'</div>'+
      (u?'<div class="senha-lin"><b>Link</b><span><a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(n.link)+'</a></span></div>':(n.link?'<div class="senha-lin"><b>Link</b><span>'+esc(n.link)+'</span></div>':''))+

    var lista=[];$('compLista').querySelectorAll('input[data-u]').forEach(function(c){if(c.checked)lista.push({usuario_id:c.dataset.u,pode_editar:$('compLista').querySelector('select[data-e="'+c.dataset.u+'"]').value==='1'});});
    this.disabled=true;
    var rr=await _sb.rpc('nota_compartilhar',{p_nota:n.id,p_com:lista});
    this.disabled=false;
    if(rr.error){toast('Não foi possível compartilhar: '+esc(rr.error.message||''),'erro');return;}
    S.comp[n.id]=lista.map(function(l){return {nota_id:n.id,usuario_id:l.usuario_id,pode_editar:l.pode_editar};});
    $('moComp').classList.remove('aberto');desenhar();
    toast(lista.length?('Nota compartilhada com '+lista.length+(lista.length>1?' pessoas.':' pessoa.')):'Nota não está mais compartilhada.','sucesso');
  };
}
['moNota','moComp'].forEach(function(id){$(id).addEventListener('mousedown',function(e){if(e.target===this){if(id==='moNota')fecharNota();else this.classList.remove('aberto');}});});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if($('moComp').classList.contains('aberto'))$('moComp').classList.remove('aberto');else if($('moNota').classList.contains('aberto'))fecharNota();}});
document.addEventListener('visibilitychange',async function(){if(document.visibilityState==='visible'&&!S.ed&&!$('moComp').classList.contains('aberto')){if(await carregar())desenhar();}});

/* ---------- início ---------- */
async function init(){
  await SagaUI.carregar('notas');
  var s=await _sb.auth.getSession();
  if(!s.data||!s.data.session){window.location.href='login_padrao_metalico.html';return;}
  var eu=await _sb.from('usuarios').select('id,nome_completo').eq('auth_user_id',s.data.session.user.id).maybeSingle();
  if(!eu.data){toast('Não foi possível identificar o seu usuário.','erro');return;}
  S.eu=eu.data.id;S.pessoas[eu.data.id]=eu.data;
  var pp=await _sb.from('usuarios').select('id,nome_completo');(pp.data||[]).forEach(function(p){S.pessoas[p.id]=p;});
  if(!(await carregar()))return;
  desenhar();
  var id=new URLSearchParams(location.search).get('nota');
  if(id){var n=S.notas.find(function(x){return x.id===id;});if(n){if(n.arquivada){S.filtro='arq';document.querySelectorAll('#pillsFiltro .pill').forEach(function(p){p.classList.toggle('active',p.dataset.f==='arq');});desenhar();}abrirNota(n);}else toast('Nota não encontrada (ou você não tem acesso).','erro');}
}
init().catch(function(e){toast('Erro ao abrir as notas: '+esc(e.message||''),'erro');});
</script>
