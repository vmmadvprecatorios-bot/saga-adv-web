<style>
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

body{min-height:100vh;background:linear-gradient(160deg,var(--navy-1),var(--navy-2) 50%,var(--navy-3));color:var(--text);font-family:Montserrat,Arial,sans-serif;overflow-x:hidden}
.app{display:flex;position:relative;z-index:1}

.novas{position:relative;display:flex}
.btn-nova{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 12px;border-radius:10px;font-size:12px;font-weight:600;letter-spacing:.2px;color:var(--text);border:1px solid color-mix(in srgb,var(--gold) 45%,var(--border-soft));background:color-mix(in srgb,var(--gold) 8%,var(--panel));transition:border-color .25s cubic-bezier(.22,.78,.25,1),background .25s cubic-bezier(.22,.78,.25,1),transform .2s cubic-bezier(.22,.78,.25,1)}

.btn-nova .mais{font-size:15px;font-weight:400;line-height:1;color:var(--gold-light,var(--gold))}.btn-nova .seta{font-size:8px;opacity:.6;margin-left:2px;transition:transform .25s cubic-bezier(.22,.78,.25,1)}.btn-nova[aria-expanded="true"] .seta{transform:rotate(180deg)}

.menu-nova button{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:center;gap:2px 9px;width:100%;padding:7px 9px;border-radius:8px;text-align:left;color:var(--text);transition:background .2s cubic-bezier(.22,.78,.25,1)}
.menu-nova button:hover,.menu-nova button:focus-visible{background:color-mix(in srgb,var(--gold) 11%,transparent);outline:0}
.menu-nova .ic{grid-row:span 2;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--gold-light,var(--gold));background:color-mix(in srgb,var(--gold) 10%,transparent)}
.menu-nova .ic svg{width:15px;height:15px}
.menu-nova b{font-size:12px;font-weight:600}.menu-nova small{font-size:10.5px;color:var(--muted);line-height:1.3}
.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.busca{flex:1 1 240px;min-width:200px;height:34px;border-radius:10px;border:1px solid var(--border-soft);background:var(--panel);padding:0 13px;font-size:12.5px;outline:0}
.busca:focus{border-color:var(--gold)}
.pills{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--border-soft);border-radius:10px;background:var(--panel);flex-wrap:wrap}

.pill:hover{color:var(--text)}
/* versão fina e discreta (pedido de 08/11); vence a regra geral do saga_tema.css só nesta tela */
html body main.content .barra .pills button.pill.active{background:color-mix(in srgb,var(--gold) 16%,transparent)!important;color:var(--text)!important;font-weight:600;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 42%,transparent)!important}

.etqs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

.etq:hover{border-color:var(--gold);color:var(--text)}.etq.ativa{border-color:var(--gold);color:var(--gold-light);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.dica-arrastar{font-size:11px;color:var(--muted);margin:-4px 2px 10px}.dica-arrastar[hidden]{display:none}

.nota.alvo-antes,.nota-lin.alvo-antes{box-shadow:0 -4px 0 0 var(--gold)}.nota.alvo-depois,.nota-lin.alvo-depois{box-shadow:0 4px 0 0 var(--gold)}
body.arrastando-notas{user-select:none;-webkit-user-select:none;cursor:grabbing}body.arrastando-notas *{cursor:grabbing!important}
.nota[data-arrastavel],.nota-lin[data-arrastavel]{cursor:grab}.nota,.nota-lin{-webkit-touch-callout:none}
.lista-notas{display:flex;flex-direction:column;gap:6px}

.nota-lin .alca{color:var(--muted);letter-spacing:-2px;font-size:14px;text-align:center}

.nota-lin .lin-tit{min-width:0}.nota-lin .lin-tit b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nota-lin .lin-tit small{display:block;color:var(--muted);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nota-lin .lin-etq{display:flex;gap:5px;flex-wrap:wrap}.nota-lin .chip{font-size:10px;border-radius:9px;padding:1px 8px;background:color-mix(in srgb,var(--text) 8%,transparent);color:var(--muted)}.nota-lin .chip.comp{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.nota-lin .lin-data{font-size:11px;color:var(--muted);text-align:right}
.nota-lin .acoes{opacity:1;display:flex;gap:2px}

.sec-titulo{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;font-weight:700;color:var(--muted);margin:16px 2px 8px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:start}.grade>.nota{margin:0}
.nota{--nc:#8b93a8;break-inside:avoid;display:block;width:100%;margin:0 0 14px;text-align:left;position:relative;border-radius:15px;padding:13px 14px 10px;background:color-mix(in srgb,var(--nc) 9%,var(--panel-solid));border:1px solid color-mix(in srgb,var(--nc) 38%,transparent);cursor:pointer;transition:transform .22s cubic-bezier(.22,.78,.25,1),box-shadow .22s,border-color .2s;}
.nota.nova{animation:notaEntra .35s cubic-bezier(.22,.78,.25,1) both}
.nota:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.28);border-color:color-mix(in srgb,var(--nc) 70%,transparent)}

.nota[data-cor=amarelo]{--nc:#f5c542}.nota[data-cor=verde]{--nc:#6fcf7f}.nota[data-cor=azul]{--nc:#5bc0eb}.nota[data-cor=rosa]{--nc:#f78fb3}
.nota[data-cor=laranja]{--nc:#f59e42}.nota[data-cor=roxo]{--nc:#b69cf0}.nota[data-cor=cinza]{--nc:#b0b7c3}

.nota .rod{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:9px}

.toast.erro{border-color:var(--danger)}.toast.sucesso{border-color:var(--success)}
/* janelas */

.mo{position:fixed;inset:0;z-index:2500;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(6,10,20,.6);backdrop-filter:blur(3px)}
.mo.aberto{display:flex}
.md{--nc:#8b93a8;width:100%;max-width:560px;max-height:calc(100vh - 36px);display:flex;flex-direction:column;border-radius:18px;background:color-mix(in srgb,var(--nc) 8%,var(--panel-solid));border:1px solid color-mix(in srgb,var(--nc) 45%,transparent);box-shadow:var(--shadow)}
.md[data-cor=amarelo]{--nc:#f5c542}.md[data-cor=verde]{--nc:#6fcf7f}.md[data-cor=azul]{--nc:#5bc0eb}.md[data-cor=rosa]{--nc:#f78fb3}.md[data-cor=laranja]{--nc:#f59e42}.md[data-cor=roxo]{--nc:#b69cf0}.md[data-cor=cinza]{--nc:#b0b7c3}
.md-cab{display:flex;align-items:center;gap:10px;padding:14px 16px 4px}

.cor-btn{position:relative}

.cor-btn>button:hover{border-color:var(--gold);color:var(--text)}

<script>
/* =====================================================================
   NOTAS (T105) · pessoais, com cores, fixar, arquivar, etiquetas, compartilhar com colegas
   Tipos: texto, lista (checklist) e senha (nome, login, senha, link, o que é).
   A senha de cada acesso fica criptografada no banco (notas_credenciais): só sai pela função nota_credencial_ver_senha (dono ou quem recebeu a nota).
   ===================================================================== */
var COLUNAS='id,dono_id,tipo,titulo,conteudo,itens,cor,fixada,arquivada,etiquetas,ordem,criado_em,atualizado_em';
var CORES=[['padrao','Sem cor'],['amarelo','Amarelo'],['verde','Verde'],['azul','Azul'],['rosa','Rosa'],['laranja','Laranja'],['roxo','Roxo'],['cinza','Cinza']];
var CORHEX={amarelo:'#f5c542',verde:'#6fcf7f',azul:'#5bc0eb',rosa:'#f78fb3',laranja:'#f59e42',roxo:'#b69cf0',cinza:'#b0b7c3'};
var ICO_COPIAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg>';
var ICO_ABRIR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v4a2 2 0 01-2 2H6a2 2 0 01-2-2V8a2 2 0 012-2h4"/></svg>';
var ICO_TRAVADO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>';
var ICO_DESTRAVADO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 017.5-2"/></svg>';
var ICO_OLHO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
var TIPO_NOME={texto:'Nota',lista:'Checklist',senha:'Senha',emails:'E-mails',telefones:'Telefones'};
// tipos que guardam acessos com senha criptografada (notas_credenciais)
function temCreds(t){return t==='senha'||t==='emails';}
function fmtTel(v){var d=String(v||'').replace(/\D/g,'').slice(0,11);if(!d)return '';if(d.length<=2)return '('+d;if(d.length<=6)return '('+d.slice(0,2)+') '+d.slice(2);if(d.length<=10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);}
// colaboradoras ativas, em ordem alfabética, para os menus de responsável
function colaboradoras(atual){var l=Object.keys(S.pessoas).map(function(k){return S.pessoas[k];}).filter(function(p){return p.ativo!==false||p.id===atual;});return l.sort(function(a,b){return String(a.nome_completo).localeCompare(String(b.nome_completo),'pt-BR');});}
var S={creds:{},visao:'cartoes',modo:'minha',vistos:{},eu:null,notas:[],comp:{},pessoas:{},filtro:'todas',etq:'',busca:'',aberta:null,ed:null};

function esc(v){var d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML;}
function toast(msg,tipo){var w=document.getElementById('toastWrap');var t=document.createElement('div');t.className='toast '+(tipo||'');t.innerHTML=msg;w.appendChild(t);setTimeout(function(){t.remove();},4500);}
function $(id){return document.getElementById(id);}
function puro(v){return window.SagaTexto?SagaTexto.puro(v||''):String(v||'').replace(/<[^>]*>/g,' ');}
function nomeDe(id){return (S.pessoas[id]||{}).nome_completo||'Colega';}
function primeiro(id){return String(nomeDe(id)).split(' ')[0];}
function ehMinha(n){return n.dono_id===S.eu;}
function podeEditar(n){return ehMinha(n)||((S.comp[n.id]||[]).some(function(c){return c.usuario_id===S.eu&&c.pode_editar;}));}
function compCom(n){return (S.comp[n.id]||[]).filter(function(c){return c.usuario_id!==S.eu;});}
function urlSegura(u){u=String(u||'').trim();if(!u)return '';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;return /^https?:\/\//i.test(u)?u:'';}
function copiar(texto,rotulo){
  var ok=function(){toast((rotulo||'Texto')+(rotulo==='Senha'?' copiada.':' copiado.'),'sucesso');};
  var antigo=function(){var t=document.createElement('textarea');t.value=texto;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();var deu=false;try{deu=document.execCommand('copy');}catch(e){}t.remove();if(deu)ok();else toast('Não foi possível copiar. Selecione e copie manualmente.','erro');};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(texto).then(ok,antigo);}else antigo();
}
async function pegarSenhaCred(id){
  var r=await _sb.rpc('nota_credencial_ver_senha',{p_cred:id});
  if(r.error){toast('Não foi possível ler a senha: '+esc(r.error.message||''),'erro');return null;}
  return r.data||'';
}

/* ---------- carregar ---------- */
async function carregar(){
  var r=await Promise.all([
    _sb.from('notas').select(COLUNAS).order('atualizado_em',{ascending:false}).limit(1000),
    _sb.from('notas_compartilhadas').select('nota_id,usuario_id,pode_editar'),
    _sb.from('notas_credenciais').select('id,nota_id,ordem,nome,login,link,tem_senha').order('ordem')
  ]);
  if(r[0].error){toast('Não foi possível carregar as notas: '+esc(r[0].error.message||''),'erro');return false;}
  S.notas=r[0].data||[];
  S.comp={};(r[1].data||[]).forEach(function(c){(S.comp[c.nota_id]=S.comp[c.nota_id]||[]).push(c);});
  S.creds={};(r[2].data||[]).forEach(function(c){(S.creds[c.nota_id]=S.creds[c.nota_id]||[]).push(c);});
  return true;
}

/* ---------- filtros e lista ---------- */
function todasEtiquetas(){var m={};S.notas.filter(ehMinha).forEach(function(n){(n.etiquetas||[]).forEach(function(e){m[e]=(m[e]||0)+1;});});return Object.keys(m).sort(function(a,b){return a.localeCompare(b,'pt-BR');});}
function passa(n){
  var f=S.filtro;
  if(f==='arq'){if(!n.arquivada)return false;}
  else{if(n.arquivada)return false;if(f==='minhas'&&!ehMinha(n))return false;if(f==='comp'&&ehMinha(n))return false;}
  if(S.etq&&(n.etiquetas||[]).indexOf(S.etq)<0)return false;
  var q=S.busca.trim().toLowerCase();
  if(q){
    var alvo=[n.titulo,puro(n.conteudo),(S.creds[n.id]||[]).map(function(c){return c.nome+' '+c.login+' '+c.link;}).join(' '),(n.etiquetas||[]).join(' '),(n.itens||[]).map(function(i){return n.tipo==='telefones'?[i.numero,String(i.numero||'').replace(/\D/g,''),i.descricao,i.responsavel_id?nomeDe(i.responsavel_id):''].join(' '):i.texto;}).join(' ')].join(' ').toLowerCase();
    if(alvo.indexOf(q)<0)return false;
  }
  return true;
}
function desenharEtiquetas(){
  var l=todasEtiquetas(),box=$('etqs');
  if(S.etq&&l.indexOf(S.etq)<0)S.etq='';
  box.innerHTML=l.map(function(e){return '<button type="button" class="etq'+(S.etq===e?' ativa':'')+'" data-e="'+esc(e)+'">'+esc(e)+'</button>';}).join('');
}
function acoesHtml(n){
  return ehMinha(n)?
    '<button type="button" data-a="fixar" title="'+(n.fixada?'Desafixar':'Fixar no topo')+'">'+(n.fixada?'📌':'📍')+'</button><button type="button" data-a="comp" title="Compartilhar">👥</button><button type="button" data-a="arq" title="'+(n.arquivada?'Desarquivar':'Arquivar')+'">🗂</button><button type="button" data-a="del" title="Apagar">🗑</button>':
    '<button type="button" data-a="sair" title="Parar de ver esta nota">🚪</button>';
}
function previaNota(n){
  if(n.tipo==='texto')return puro(n.conteudo).slice(0,140);
  if(n.tipo==='lista'){var it=n.itens||[],f=it.filter(function(i){return i.ok;}).length,ab=it.find(function(i){return !i.ok;});return it.length?(f+'/'+it.length+' itens'+(ab?' · '+ab.texto:'')):'sem itens';}
  if(n.tipo==='telefones'){var ts=n.itens||[];return ts.length?(ts.length+(ts.length>1?' números: ':' número: ')+ts.map(function(t){return t.numero+(t.responsavel_id?' ('+primeiro(t.responsavel_id)+')':'');}).join(', ')):'sem números';}
  var cs=S.creds[n.id]||[];if(n.tipo==='emails')return cs.length?(cs.length+(cs.length>1?' e-mails: ':' e-mail: ')+cs.map(function(c){return c.login||c.nome||'sem e-mail';}).join(', ')):'sem e-mails';
  return cs.length?(cs.length+(cs.length>1?' acessos: ':' acesso: ')+cs.map(function(c){return c.nome||c.login||'sem nome';}).join(', ')):'sem acessos';
}
function dataCurta(iso){var d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
function linha(n){
  var dono=ehMinha(n),comp=compCom(n);
  var chips=(n.etiquetas||[]).map(function(e){return '<span class="chip">'+esc(e)+'</span>';}).join('');
  if(!dono)chips+='<span class="chip comp">de '+esc(primeiro(n.dono_id))+(podeEditar(n)?' · pode editar':' · só ver')+'</span>';
  else if(comp.length)chips+='<span class="chip comp">com '+comp.length+(comp.length>1?' pessoas':' pessoa')+'</span>';
  return '<article class="nota-lin'+(S.vistos[n.id]?'':' nova')+'" data-id="'+esc(n.id)+'" data-cor="'+esc(n.cor)+'" tabindex="0"'+(dono&&S.modo==='minha'?' data-arrastavel':'')+'>'+
    '<span class="alca" title="'+(dono&&S.modo==='minha'?'Arraste para mudar a ordem':'')+'">'+(dono&&S.modo==='minha'?'⋮⋮':'')+'</span><span class="tipo">'+TIPO_NOME[n.tipo]+'</span>'+
    '<div class="lin-tit"><b>'+(n.fixada?'📌 ':'')+esc(n.titulo||'Sem título')+'</b><small>'+esc(previaNota(n))+'</small></div>'+
    '<div class="lin-etq">'+chips+'</div><span class="lin-data">'+dataCurta(n.atualizado_em)+'</span><div class="acoes">'+acoesHtml(n)+'</div></article>';
}
function cartao(n){
  var corpo='';
  if(n.tipo==='texto'){corpo=n.conteudo?'<div class="corpo'+(puro(n.conteudo).length>260?' corta':'')+'">'+SagaTexto.html(n.conteudo)+'</div>':'';}
  else if(n.tipo==='lista'){
    var it=(n.itens||[]),abertos=it.filter(function(i){return !i.ok;}),feitos=it.filter(function(i){return i.ok;});
    var ordem=abertos.concat(feitos).slice(0,9);
    corpo='<div class="corpo'+(it.length>9?' corta':'')+'">'+ordem.map(function(i){var idx=it.indexOf(i);return '<label class="it'+(i.ok?' ok':'')+'"><input type="checkbox" data-it="'+idx+'"'+(i.ok?' checked':'')+(podeEditar(n)?'':' disabled')+'><span>'+esc(i.texto)+'</span></label>';}).join('')+(it.length>9?'<div class="it"><span style="color:var(--muted)">+ '+(it.length-9)+' itens</span></div>':'')+'</div>';
  }else if(n.tipo==='telefones'){
    var ts=n.itens||[],tm=ts.slice(0,6);
    corpo='<div class="corpo">'+tm.map(function(t,ix){var d=String(t.numero||'').replace(/\D/g,'');
      return '<div class="tel"><div class="num"><span>'+esc(t.numero||'')+'</span><button class="ico" type="button" data-cptel="'+ix+'" title="Copiar o número">'+ICO_COPIAR+'</button>'+(d.length>=10?'<button class="ico" type="button" data-wa="'+ix+'" title="Abrir no WhatsApp">'+ICO_ABRIR+'</button>':'')+'</div>'+
        '<div class="quem">'+(t.responsavel_id?'Responsável: <b>'+esc(nomeDe(t.responsavel_id))+'</b>':'<i>sem responsável</i>')+(t.descricao?' · '+esc(t.descricao):'')+'</div></div>';
    }).join('')+(ts.length>6?'<div class="quem">+ '+(ts.length-6)+' números</div>':'')+(!ts.length?'<i style="color:var(--muted)">Sem números cadastrados</i>':'')+
      (n.conteudo?'<div style="margin-top:6px;color:var(--muted)">'+SagaTexto.html(n.conteudo)+'</div>':'')+'</div>';
  }else{
    var cs=S.creds[n.id]||[],mostra=cs.slice(0,3),em=n.tipo==='emails';
    corpo='<div class="corpo">'+mostra.map(function(c){
      var u=urlSegura(c.link),host='';try{host=u?new URL(u).hostname:c.link;}catch(x){host=c.link;}

(function(){

    fn();
    medir();
    antes.forEach(function(a,c){
      var b=d.rects.get(c)||c.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top;if(!dx&&!dy)return;
      c.style.transition='none';c.style.transform='translate('+dx+'px,'+dy+'px)';

    document.body.appendChild(g);d.ghost=g;d.el.classList.add('arrastando');document.body.classList.add('arrastando-notas');medir();
    if(!semMovimento()&&g.animate)g.animate([{transform:'scale(1)',boxShadow:'0 2px 6px rgba(0,0,0,.12)'},{transform:'scale(1.02)',boxShadow:'0 18px 40px rgba(0,0,0,.35)'}],{duration:180,easing:'cubic-bezier(.22,.78,.25,1)'});

function abrirNota(n,tipo){
  var novo=!n,pode=novo||podeEditar(n),dono=novo||ehMinha(n);
  S.ed={id:n?n.id:null,tipo:n?n.tipo:tipo,titulo:n?n.titulo:'',conteudo:n?n.conteudo:'',itens:n?(n.itens||[]).map(function(i){return n.tipo==='telefones'?{numero:i.numero||'',responsavel_id:i.responsavel_id||'',descricao:i.descricao||''}:{texto:i.texto,ok:!!i.ok};}):[],
    creds:n?(S.creds[n.id]||[]).map(function(c){return {id:c.id,nome:c.nome,login:c.login,link:c.link,tem_senha:!!c.tem_senha,senha:'',senhaSuja:false,senhaLida:false,ver:false,travada:!!c.tem_senha};}):[],cor:n?n.cor:'padrao',etiquetas:n?(n.etiquetas||[]).slice():[],pode:pode,dono:dono,sujo:false};
  var e=S.ed,m=$('mdNota');
  m.dataset.cor=e.cor;m.style.maxWidth=(temCreds(e.tipo)||e.tipo==='telefones')?'680px':'';
  var corpo='';
  if(e.tipo==='texto')corpo='<div class="campo"><textarea id="edTexto" placeholder="Escreva sua nota..."></textarea></div>';
  else if(e.tipo==='lista')corpo='<div class="campo"><div class="itens" id="edItens"></div><div class="item-ed" style="margin-top:6px"><span style="width:16px;text-align:center;color:var(--muted)">+</span><input type="text" id="edNovoItem" placeholder="Novo item (Enter para incluir)"'+(pode?'':' disabled')+'></div></div>';
  else if(e.tipo==='telefones')corpo=
    '<div id="edTels" style="display:flex;flex-direction:column;gap:7px"></div>'+(pode?'<button class="btn" type="button" id="addTel">+ Adicionar telefone</button>':'')+
    '<div class="campo"><label for="edTexto">Observações (opcional)</label><textarea id="edTexto" placeholder="Ex.: chips da operadora, horário de atendimento..."></textarea></div>';
  else if(e.tipo==='emails')corpo=
    '<div id="edCreds" style="display:flex;flex-direction:column;gap:10px"></div>'+(pode?'<button class="btn" type="button" id="addCred">+ Adicionar outro e-mail</button>':'')+
    '<div class="campo"><label for="edTexto">Observações (opcional)</label><textarea id="edTexto" placeholder="Ex.: provedor do e-mail, quando a senha foi trocada..."></textarea></div>'+
    '<div class="aviso-senha">As senhas ficam criptografadas no sistema. Se você compartilhar esta nota, quem receber poderá ver as senhas.</div>';
  else corpo=
    '<div id="edCreds" style="display:flex;flex-direction:column;gap:10px"></div>'+(pode?'<button class="btn" type="button" id="addCred">+ Adicionar outro acesso</button>':'')+
    '<div class="campo"><label for="edTexto">Observações (opcional)</label><textarea id="edTexto" placeholder="Ex.: acessos do escritório, quem usa, quando trocar..."></textarea></div>'+
    '<div class="aviso-senha">As senhas ficam criptografadas no sistema. Se você compartilhar esta nota, quem receber poderá ver as senhas.</div>';
  var corBtn=dono?'<div class="cor-btn"><button type="button" id="corBtn" aria-haspopup="menu" aria-expanded="false" title="Cor da nota"><span class="bola" id="corBola" style="--c:'+(CORHEX[e.cor]||'transparent')+'"></span>Cor ▾</button><div class="cor-menu" id="corMenu" role="menu">'+CORES.map(function(c){return '<button type="button" role="menuitem" data-cor="'+c[0]+'" class="'+(e.cor===c[0]?'on':'')+'"><span class="bola" style="--c:'+(CORHEX[c[0]]||'transparent')+'"></span>'+c[1]+'</button>';}).join('')+'</div></div>':'';
  var etq=dono?'<div class="campo"><label>Etiquetas</label><div class="etq-ed" id="edEtq"></div></div>':'';
  m.innerHTML='<div class="md-cab"><input type="text" id="edTitulo" placeholder="'+(e.tipo==='senha'?'Título da nota (ex.: Acessos dos tribunais)':e.tipo==='emails'?'Título (ex.: E-mails funcionais da equipe)':e.tipo==='telefones'?'Título (ex.: Telefones do escritório)':'Título')+'" maxlength="200"'+(pode?'':' readonly')+'><span class="tipo" style="font-size:10px;font-weight:700;color:var(--muted)">'+TIPO_NOME[e.tipo].toUpperCase()+'</span>'+corBtn+'</div>'+
    '<div class="md-corpo">'+corpo+etq+(pode?'':'<div class="somente-leitura-aviso">Você pode ver esta nota, mas não alterá-la.</div>')+'</div>'+
    '<div class="md-rod"><div class="esq">'+(dono&&!novo?'<button class="btn" type="button" id="btComp">👥 Compartilhar</button><button class="btn" type="button" id="btArq">'+(n.arquivada?'Desarquivar':'Arquivar')+'</button><button class="btn perigo" type="button" id="btDel">Apagar</button>':'')+(!dono?'<button class="btn" type="button" id="btSair">Parar de ver</button>':'')+'</div>'+
    '<div class="dir"><button class="btn" type="button" id="btFechar">'+(pode?'Cancelar':'Fechar')+'</button>'+(pode?'<button class="btn prim" type="button" id="btSalvar">Salvar</button>':'')+'</div></div>';
  $('edTitulo').value=e.titulo;
  var ta=$('edTexto');if(ta){if(window.SagaTexto){var ed=SagaTexto.ligar(ta);if(!pode&&ed)ed.leitura(true);}ta.value=e.conteudo;}
  if(e.tipo==='lista')desenharItens();
  if(temCreds(e.tipo)){if(!e.creds.length&&pode)e.creds.push(novaCred());desenharCreds();}
  if(e.tipo==='telefones'){if(!e.itens.length&&pode)e.itens.push(novoTel());desenharTels();}
  if(dono)desenharEtqEd();
  ligarJanela();
  $('moNota').classList.add('aberto');
  setTimeout(function(){var f=novo?$('edTitulo'):null;if(f)f.focus();},50);
}
function novaCred(){return {id:null,nome:'',login:'',link:'',tem_senha:false,senha:'',senhaSuja:false,senhaLida:false,ver:false};}
function desenharCreds(){
  var e=S.ed,box=$('edCreds');if(!box)return;
  box.innerHTML=e.creds.map(function(c,i){
    var ro=e.pode?'':' readonly',em=e.tipo==='emails';
    return '<div class="cred-q" data-q="'+i+'">'+
      '<div class="cred-q-cab">'+(em?selColab(c.nome,!e.pode):'<input type="text" data-f="nome" placeholder="Nome (ex.: Portal do TJAL)" maxlength="200" value="'+esc(c.nome)+'"'+ro+'>')+
        (e.pode?'<button class="ico" type="button" data-q-sobe="'+i+'" title="Subir"'+(i?'':' disabled style="opacity:.3"')+'>▲</button><button class="ico" type="button" data-q-desce="'+i+'" title="Descer"'+(i<e.creds.length-1?'':' disabled style="opacity:.3"')+'>▼</button><button class="ico" type="button" data-q-rm="'+i+'" title="Remover este acesso">✕</button>':'')+'</div>'+
      '<div class="cred-g"><div class="campo"><label>'+(em?'E-mail funcional':'Login')+'</label><div class="linha"><input type="text" data-f="login" autocomplete="off" placeholder="'+(em?'nome@victormoraisadv.com.br':'E-mail, CPF ou usuário')+'" value="'+esc(c.login)+'"'+ro+'><button class="ico" type="button" data-q-cp="login" data-i="'+i+'" title="Copiar o login">'+ICO_COPIAR+'</button></div></div>'+
      '<div class="campo"><label>Senha</label><div class="linha"><input type="'+(c.ver?'text':'password')+'" data-f="senha" autocomplete="new-password" placeholder="'+(c.tem_senha&&!c.senhaLida?'senha guardada':'Digite ou gere')+'" value="'+esc(c.senhaLida?c.senha:'')+'"'+ro+(c.travada?' readonly':'')+'><button class="ico" type="button" data-q-olho="'+i+'" title="Mostrar / esconder a senha">'+ICO_OLHO+'</button><button class="ico" type="button" data-q-cp="senha" data-i="'+i+'" title="Copiar a senha">'+ICO_COPIAR+'</button>'+(e.pode?'<button class="ico'+(c.travada?' travado':'')+'" type="button" data-q-trava="'+i+'" title="'+(c.travada?'Senha travada: clique para destravar':'Clique para travar a senha e evitar mudar sem querer')+'" aria-pressed="'+(c.travada?'true':'false')+'">'+(c.travada?ICO_TRAVADO:ICO_DESTRAVADO)+'</button><button class="mini" type="button" data-q-ger="'+i+'" title="'+(c.travada?'Destrave o cadeado para gerar uma nova senha':'Gerar uma senha forte')+'"'+(c.travada?' disabled style="opacity:.35;cursor:not-allowed"':'')+'>Gerar</button>':'')+'</div></div></div>'+
      '<div class="campo"><label>'+(em?'Onde entrar (webmail, opcional)':'Link do site')+'</label><div class="linha"><input type="text" data-f="link" autocomplete="off" placeholder="https://..." value="'+esc(c.link)+'"'+ro+'><button class="ico" type="button" data-q-abrir="'+i+'" title="Abrir a página">'+ICO_ABRIR+'</button></div></div>'+
    '</div>';
  }).join('')||'<div class="somente-leitura-aviso">'+(e.tipo==='emails'?'Nenhum e-mail cadastrado.':'Nenhum acesso cadastrado.')+'</div>';
}
// menu de quem é o e-mail: colaboradoras do sistema (o nome fica guardado) ou o escritório
function selColab(nome,ro){var l=colaboradoras(),tem=!nome||nome==='Escritório (geral)'||l.some(function(p){return p.nome_completo===nome;});
  return '<select data-f="nome" aria-label="De quem é este e-mail"'+(ro?' disabled':'')+'><option value="">De quem é este e-mail?</option>'+l.map(function(p){return '<option'+(p.nome_completo===nome?' selected':'')+'>'+esc(p.nome_completo)+'</option>';}).join('')+'<option'+(nome==='Escritório (geral)'?' selected':'')+'>Escritório (geral)</option>'+(tem?'':'<option selected>'+esc(nome)+'</option>')+'</select>';}
function novoTel(){return {numero:'',responsavel_id:'',descricao:''};}
function desenharTels(){
  var e=S.ed,box=$('edTels');if(!box)return;var ro=e.pode?'':' readonly';
  box.innerHTML=e.itens.map(function(t,i){
    return '<div class="tel-q" data-t="'+i+'"><input type="text" inputmode="tel" data-tf="numero" placeholder="(82) 99999-9999" aria-label="Número" value="'+esc(t.numero)+'"'+ro+'>'+
      '<select data-tf="responsavel_id" aria-label="Responsável pelo número"'+(e.pode?'':' disabled')+'><option value="">Responsável...</option>'+colaboradoras(t.responsavel_id).map(function(p){return '<option value="'+esc(p.id)+'"'+(p.id===t.responsavel_id?' selected':'')+'>'+esc(p.nome_completo)+'</option>';}).join('')+'</select>'+
      '<input type="text" data-tf="descricao" maxlength="120" placeholder="Para que serve (ex.: WhatsApp da Captação)" aria-label="Para que serve" value="'+esc(t.descricao)+'"'+ro+'>'+
      '<div class="acoes-q"><button class="ico" type="button" data-tcp="'+i+'" title="Copiar o número">'+ICO_COPIAR+'</button>'+(e.pode?'<button class="ico" type="button" data-tsobe="'+i+'" title="Subir"'+(i?'':' disabled style="opacity:.3"')+'>▲</button><button class="ico" type="button" data-trm="'+i+'" title="Remover este número">✕</button>':'')+'</div></div>';
  }).join('')||'<div class="somente-leitura-aviso">Nenhum número cadastrado.</div>';
}
function desenharItens(){
  var e=S.ed,box=$('edItens');if(!box)return;
  var ordem=e.itens.map(function(i,ix){return {i:i,ix:ix};}).sort(function(a,b){return (a.i.ok-b.i.ok)||(a.ix-b.ix);});
  box.innerHTML=ordem.map(function(o){return '<div class="item-ed'+(o.i.ok?' ok':'')+'"><input type="checkbox" data-ix="'+o.ix+'"'+(o.i.ok?' checked':'')+(e.pode?'':' disabled')+'><input type="text" data-tx="'+o.ix+'" value="'+esc(o.i.texto)+'"'+(e.pode?'':' readonly')+'>'+(e.pode?'<button type="button" data-rm="'+o.ix+'" aria-label="Remover item">✕</button>':'')+'</div>';}).join('');
}
function desenharEtqEd(){
  var e=S.ed,box=$('edEtq');if(!box)return;
  var sug=todasEtiquetas().filter(function(x){return e.etiquetas.indexOf(x)<0;});
  box.innerHTML=e.etiquetas.map(function(x,i){return '<span class="chip">'+esc(x)+'<button type="button" data-rmetq="'+i+'" aria-label="Tirar etiqueta">✕</button></span>';}).join('')+
    '<input type="text" id="edNovaEtq" placeholder="Nova etiqueta (ex.: trabalho)" maxlength="40" autocomplete="off"><button type="button" class="mini" id="edAddEtq">Adicionar</button>'+
    (sug.length?'<div class="sug-etq" style="flex-basis:100%"><span>Já usadas:</span>'+sug.map(function(x){return '<button type="button" class="etq" data-sugetq="'+esc(x)+'">'+esc(x)+'</button>';}).join('')+'</div>':'');
}
function juntarEtiqueta(v){
  var e=S.ed;if(!e)return;v=String(v||'').trim();if(!v)return;
  if(e.etiquetas.some(function(x){return x.toLowerCase()===v.toLowerCase();}))return;
  if(e.etiquetas.length>=12){toast('No máximo 12 etiquetas por nota.','erro');return;}
  e.etiquetas.push(v);e.sujo=true;desenharEtqEd();
}
function ligarJanela(){
  var e=S.ed,m=$('mdNota');
  m.addEventListener('input',function(){e.sujo=true;},{once:true});
  $('edTitulo').addEventListener('input',function(){e.titulo=this.value;});
  var credsBox=$('edCreds');
  if(credsBox){
    var carregarSenhaQ=async function(c){
      if(c.senhaLida||!c.id||!c.tem_senha)return true;
      var sv=await pegarSenhaCred(c.id);if(sv==null)return false;c.senha=sv;c.senhaLida=true;return true;
    };
    credsBox.addEventListener('input',function(ev){
      var q=ev.target.closest('[data-q]');if(!q)return;var c=e.creds[+q.dataset.q],f=ev.target.dataset.f;if(!c||!f)return;
      c[f]=ev.target.value;e.sujo=true;if(f==='senha'){c.senhaSuja=true;c.senhaLida=true;}
    });
    credsBox.addEventListener('click',async function(ev){
      var b=ev.target.closest('button');if(!b)return;
      var i=b.dataset.qSobe!=null?+b.dataset.qSobe:b.dataset.qDesce!=null?+b.dataset.qDesce:b.dataset.qRm!=null?+b.dataset.qRm:b.dataset.qOlho!=null?+b.dataset.qOlho:b.dataset.qGer!=null?+b.dataset.qGer:b.dataset.qTrava!=null?+b.dataset.qTrava:b.dataset.qAbrir!=null?+b.dataset.qAbrir:+b.dataset.i;
      var c=e.creds[i];if(!c)return;
      if(b.dataset.qSobe!=null&&i>0){e.creds.splice(i-1,0,e.creds.splice(i,1)[0]);e.sujo=true;desenharCreds();}
      else if(b.dataset.qDesce!=null&&i<e.creds.length-1){e.creds.splice(i+1,0,e.creds.splice(i,1)[0]);e.sujo=true;desenharCreds();}
      else if(b.dataset.qRm!=null){
        var tem=c.nome||c.login||c.link||c.tem_senha||c.senha;
        var ok=!tem||(window.sagaConfirmar?await sagaConfirmar('Remover acesso','Remover "'+(c.nome||c.login||'este acesso')+'" desta nota? Vale ao salvar a nota.','Remover',true):true);
        if(ok){e.creds.splice(i,1);e.sujo=true;desenharCreds();}
      }
      else if(b.dataset.qOlho!=null){
        if(!c.ver){if(!(await carregarSenhaQ(c)))return;c.ver=true;desenharCreds();clearTimeout(c._t);c._t=setTimeout(function(){c.ver=false;if($('edCreds'))desenharCreds();},30000);}
        else{c.ver=false;desenharCreds();}
      }
      else if(b.dataset.qTrava!=null){c.travada=!c.travada;desenharCreds();}
      else if(b.dataset.qGer!=null){if(c.travada)return;c.senha=gerarSenha();c.senhaSuja=true;c.senhaLida=true;c.ver=true;c.travada=true;e.sujo=true;desenharCreds();clearTimeout(c._t);c._t=setTimeout(function(){c.ver=false;if($('edCreds'))desenharCreds();},30000);}
      else if(b.dataset.qAbrir!=null){var u=urlSegura(c.link);if(u)window.open(u,'_blank','noopener,noreferrer');else toast('Preencha um link válido.','erro');}
      else if(b.dataset.qCp==='login'){if(c.login)copiar(c.login,'Login');else toast('Login vazio.','erro');}
      else if(b.dataset.qCp==='senha'){if(!(await carregarSenhaQ(c)))return;if(c.senha)copiar(c.senha,'Senha');else toast('Este acesso ainda não tem senha.','erro');}
    });
    if($('addCred'))$('addCred').onclick=function(){e.creds.push(novaCred());e.sujo=true;desenharCreds();var qs=credsBox.querySelectorAll('[data-f=nome]');if(qs.length)qs[qs.length-1].focus();};
  }
  var tels=$('edTels');
  if(tels){
    tels.addEventListener('input',function(ev){var q=ev.target.closest('[data-t]'),f=ev.target.dataset.tf;if(!q||!f)return;var t=e.itens[+q.dataset.t];if(!t)return;
      if(f==='numero'){var v=fmtTel(ev.target.value);ev.target.value=v;t.numero=v;}else t[f]=ev.target.value;e.sujo=true;});
    tels.addEventListener('change',function(ev){var q=ev.target.closest('[data-t]'),f=ev.target.dataset.tf;if(q&&f==='responsavel_id'){e.itens[+q.dataset.t].responsavel_id=ev.target.value;e.sujo=true;}});
    tels.addEventListener('click',async function(ev){var b=ev.target.closest('button');if(!b)return;
      if(b.dataset.tcp!=null){var t=e.itens[+b.dataset.tcp];if(t&&t.numero)copiar(t.numero,'Número');else toast('Número vazio.','erro');}
      else if(b.dataset.tsobe!=null){var i=+b.dataset.tsobe;if(i>0){e.itens.splice(i-1,0,e.itens.splice(i,1)[0]);e.sujo=true;desenharTels();}}
      else if(b.dataset.trm!=null){var k=+b.dataset.trm,x=e.itens[k];var ok=!(x.numero||x.descricao)||(window.sagaConfirmar?await sagaConfirmar('Remover número','Remover '+(x.numero||'este número')+' desta nota? Vale ao salvar a nota.','Remover',true):true);if(ok){e.itens.splice(k,1);e.sujo=true;desenharTels();}}
    });
    if($('addTel'))$('addTel').onclick=function(){e.itens.push(novoTel());e.sujo=true;desenharTels();var qs=tels.querySelectorAll('[data-tf=numero]');if(qs.length)qs[qs.length-1].focus();};
  }
  var itens=$('edItens');
  if(itens){
    itens.addEventListener('change',function(ev){var c=ev.target.closest('input[data-ix]');if(c){e.itens[+c.dataset.ix].ok=c.checked;e.sujo=true;desenharItens();}});
    itens.addEventListener('input',function(ev){var t=ev.target.closest('input[data-tx]');if(t){e.itens[+t.dataset.tx].texto=t.value;e.sujo=true;}});
    itens.addEventListener('click',function(ev){var b=ev.target.closest('[data-rm]');if(b){e.itens.splice(+b.dataset.rm,1);e.sujo=true;desenharItens();}});
    $('edNovoItem').addEventListener('keydown',function(ev){if(ev.key!=='Enter')return;ev.preventDefault();var v=this.value.trim();if(!v)return;e.itens.push({texto:v,ok:false});this.value='';e.sujo=true;desenharItens();});
  }
  var cbtn=$('corBtn'),cmenu=$('corMenu');
  if(cbtn){
    var fechaMenu=function(){cmenu.classList.remove('aberto');cbtn.setAttribute('aria-expanded','false');};
    cbtn.addEventListener('click',function(ev){ev.stopPropagation();var ab=cmenu.classList.toggle('aberto');cbtn.setAttribute('aria-expanded',String(ab));});
    cmenu.addEventListener('click',function(ev){
      var b=ev.target.closest('button[data-cor]');if(!b)return;ev.stopPropagation();
      e.cor=b.dataset.cor;e.sujo=true;m.dataset.cor=e.cor;$('corBola').style.setProperty('--c',CORHEX[e.cor]||'transparent');
      cmenu.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});fechaMenu();
    });
    m.addEventListener('click',function(ev){if(!ev.target.closest('.cor-btn'))fechaMenu();});
  }
  var etq=$('edEtq');
  if(etq){
    etq.addEventListener('click',function(ev){
      var b=ev.target.closest('[data-rmetq]');if(b){e.etiquetas.splice(+b.dataset.rmetq,1);e.sujo=true;desenharEtqEd();return;}
      var sg=ev.target.closest('[data-sugetq]');if(sg){juntarEtiqueta(sg.dataset.sugetq);return;}
      if(ev.target.closest('#edAddEtq')){juntarEtiqueta($('edNovaEtq').value);}
    });
    etq.addEventListener('keydown',function(ev){
      if(ev.key!=='Enter'&&ev.key!==',')return;var t=ev.target;if(t.id!=='edNovaEtq')return;ev.preventDefault();juntarEtiqueta(t.value);var nn=$('edNovaEtq');if(nn)nn.focus();
    });
  }
  $('btFechar').onclick=function(){fecharNota();};
  if($('btSalvar'))$('btSalvar').onclick=salvarNota;
  var n=e.id?S.notas.find(function(x){return x.id===e.id;}):null;
  if($('btComp'))$('btComp').onclick=function(){fecharNota(true);abrirCompartilhar(n);};
  if($('btArq'))$('btArq').onclick=async function(){await atualizarNota(n.id,{arquivada:!n.arquivada,fixada:false},n.arquivada?'Nota desarquivada.':'Nota arquivada.');fecharNota(true);desenhar();};
  if($('btDel'))$('btDel').onclick=function(){apagarNota(n);};
  if($('btSair'))$('btSair').onclick=function(){sairDaNota(n);};
}
async function salvarNota(){
  var e=S.ed,btn=$('btSalvar');if(!e||!e.pode||btn.disabled)return;
  if($('edNovaEtq'))juntarEtiqueta($('edNovaEtq').value);
  var conteudo=$('edTexto')?$('edTexto').value:'';
  var itens;
  if(e.tipo==='telefones'){
    itens=e.itens.map(function(t){return {numero:fmtTel(t.numero),responsavel_id:t.responsavel_id||null,descricao:String(t.descricao||'').trim()};}).filter(function(t){return t.numero||t.descricao;});
    var semResp=itens.find(function(t){return !t.responsavel_id;});
    if(semResp){toast('Escolha a colaboradora responsável pelo número '+esc(semResp.numero||'')+'.','erro');return;}
    var curto=itens.find(function(t){return String(t.numero).replace(/\D/g,'').length<10;});
    if(curto){toast('Número incompleto: '+esc(curto.numero||'(vazio)')+'. Use DDD + número.','erro');return;}
  }else itens=e.itens.map(function(i){return {texto:String(i.texto||'').trim(),ok:!!i.ok};}).filter(function(i){return i.texto;});
  var credsValidas=(e.creds||[]).filter(function(c){return c.nome.trim()||c.login.trim()||c.link.trim()||c.senha||c.tem_senha;});
  var vazio=!e.titulo.trim()&&!(puro(conteudo))&&!itens.length&&!credsValidas.length&&!(e.id&&(S.creds[e.id]||[]).length);
  if(vazio){fecharNota(true);return;}
  btn.disabled=true;
  var campos={titulo:e.titulo.trim(),conteudo:conteudo,itens:itens};
  if(e.dono){campos.cor=e.cor;campos.etiquetas=e.etiquetas;}
  var id=e.id,r;
  if(id){r=await _sb.from('notas').update(campos).eq('id',id).select(COLUNAS).single();}
  else{campos.tipo=e.tipo;campos.ordem=-Date.now()/1000;r=await _sb.from('notas').insert(campos).select(COLUNAS).single();}
  if(r.error){btn.disabled=false;toast('Não foi possível salvar: '+esc(r.error.message||''),'erro');return;}
  id=r.data.id;
  if(temCreds(e.tipo)){
    var itensC=credsValidas.map(function(c){var o={id:c.id,nome:c.nome.trim(),login:c.login.trim(),link:c.link.trim()};if(c.senhaSuja)o.senha=c.senha;return o;});
    var rs=await _sb.rpc('nota_credenciais_salvar',{p_nota:id,p_itens:itensC});
    if(rs.error){btn.disabled=false;toast('A nota foi salva, mas os acessos não: '+esc(rs.error.message||''),'erro');await carregar();desenhar();return;}
    S.creds[id]=(rs.data||[]).map(function(c){return {id:c.id,nota_id:c.nota_id,ordem:c.ordem,nome:c.nome,login:c.login,link:c.link,tem_senha:c.tem_senha};});
  }
  var i=S.notas.findIndex(function(x){return x.id===id;});if(i>=0)S.notas[i]=r.data;else S.notas.unshift(r.data);
  fecharNota(true);desenhar();toast('Nota salva.','sucesso');
}
function fecharNota(forcar){
  S.ed=null;
  fecharJanela($('moNota'),function(){if(!$('moNota').classList.contains('aberto'))$('mdNota').innerHTML='';});
  if(location.search)history.replaceState(null,'',location.pathname);
}

/* ---------- compartilhar ---------- */
async function abrirCompartilhar(n){
  if(!n)return;
  var r=await _sb.rpc('notas_colegas');
  if(r.error){toast('Não foi possível listar os colegas.','erro');return;}
  var colegas=r.data||[];colegas.forEach(function(c){S.pessoas[c.id]=c;});
  var atuais={};(S.comp[n.id]||[]).forEach(function(c){atuais[c.usuario_id]=c;});
  var m=$('mdComp');m.dataset.cor=n.cor;
  m.innerHTML='<div class="md-cab"><div style="flex:1;font-size:16px;font-weight:700">Compartilhar nota</div></div>'+
    '<div class="md-corpo"><div class="somente-leitura-aviso">Escolha com quem compartilhar "'+esc(n.titulo||'nota sem título')+'". Cada pessoa recebe um aviso no sino.'+(temCreds(n.tipo)?' <b>Atenção: quem receber poderá ver a senha.</b>':'')+'</div><div class="comp-lista" id="compLista">'+
    (colegas.length?colegas.map(function(c){var a=atuais[c.id];return '<div class="comp-lin"><label><input type="checkbox" data-u="'+esc(c.id)+'"'+(a?' checked':'')+'>'+esc(c.nome_completo)+'</label><select data-e="'+esc(c.id)+'"><option value="0"'+(a&&a.pode_editar?'':' selected')+'>Só ver</option><option value="1"'+(a&&a.pode_editar?' selected':'')+'>Pode editar</option></select></div>';}).join(''):'<div class="somente-leitura-aviso">Nenhum colega disponível.</div>')+
    '</div></div><div class="md-rod"><div class="dir"><button class="btn" type="button" id="cpCancelar">Cancelar</button><button class="btn prim" type="button" id="cpSalvar">Salvar</button></div></div>';
  $('moComp').classList.add('aberto');
  $('cpCancelar').onclick=function(){fecharJanela($('moComp'));};
  $('cpSalvar').onclick=async function(){
    var lista=[];$('compLista').querySelectorAll('input[data-u]').forEach(function(c){if(c.checked)lista.push({usuario_id:c.dataset.u,pode_editar:$('compLista').querySelector('select[data-e="'+c.dataset.u+'"]').value==='1'});});
    this.disabled=true;
    var rr=await _sb.rpc('nota_compartilhar',{p_nota:n.id,p_com:lista});
    this.disabled=false;
    if(rr.error){toast('Não foi possível compartilhar: '+esc(rr.error.message||''),'erro');return;}
    S.comp[n.id]=lista.map(function(l){return {nota_id:n.id,usuario_id:l.usuario_id,pode_editar:l.pode_editar};});
    fecharJanela($('moComp'));desenhar();
    toast(lista.length?('Nota compartilhada com '+lista.length+(lista.length>1?' pessoas.':' pessoa.')):'Nota não está mais compartilhada.','sucesso');
  };
}
['moNota','moComp'].forEach(function(id){$(id).addEventListener('mousedown',function(e){if(e.target===this){if(id==='moNota')fecharNota();else this.classList.remove('aberto');}});});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if($('moComp').classList.contains('aberto'))fecharJanela($('moComp'));else if($('moNota').classList.contains('aberto'))fecharNota();}});
document.addEventListener('visibilitychange',async function(){if(document.visibilityState==='visible'&&!S.ed&&!$('moComp').classList.contains('aberto')){if(await carregar())desenhar();}});

/* ---------- início ---------- */
async function init(){
  await SagaUI.carregar('notas');
  var s=await _sb.auth.getSession();
  if(!s.data||!s.data.session){window.location.href='login_padrao_metalico.html';return;}
  var eu=await _sb.from('usuarios').select('id,nome_completo').eq('auth_user_id',s.data.session.user.id).maybeSingle();
  if(!eu.data){toast('Não foi possível identificar o seu usuário.','erro');return;}
  S.eu=eu.data.id;S.pessoas[eu.data.id]=eu.data;
  var pp=await _sb.from('usuarios').select('id,nome_completo,ativo');(pp.data||[]).forEach(function(p){S.pessoas[p.id]=p;});
  if(!(await carregar()))return;
  desenhar();
  var id=new URLSearchParams(location.search).get('nota');
  if(id){var n=S.notas.find(function(x){return x.id===id;});if(n){if(n.arquivada){S.filtro='arq';document.querySelectorAll('#pillsFiltro .pill').forEach(function(p){p.classList.toggle('active',p.dataset.f==='arq');});desenhar();}abrirNota(n);}else toast('Nota não encontrada (ou você não tem acesso).','erro');}
}
init().catch(function(e){toast('Erro ao abrir as notas: '+esc(e.message||''),'erro');});
</script>
