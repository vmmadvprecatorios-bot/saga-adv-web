<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Não receber mais e-mails</title>
<style>
/* Página pública do descadastro dos e-mails (bloco 220). Não mostra nenhum dado de cliente. */
:root{--bg:#EEF1F5;--card:#FFFFFF;--tx:#2B3340;--sub:#6A7485;--ok:#1E8E4E;--err:#B42318;--bd:#DCE2EA}
@media (prefers-color-scheme:dark){:root{--bg:#141A24;--card:#1C2431;--tx:#E6EAF0;--sub:#9AA6B8;--ok:#4CC38A;--err:#F27A6E;--bd:#2E3A4D}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--tx);font:15px/1.6 Arial,Helvetica,sans-serif}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;max-width:460px;width:100%;padding:28px 26px;text-align:center}
h1{font:600 21px/1.3 Georgia,serif;margin:10px 0 8px}p{margin:0 0 10px;color:var(--sub)}
.i{width:46px;height:46px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid var(--bd)}
.ok .i{border-color:var(--ok);color:var(--ok)}.er .i{border-color:var(--err);color:var(--err)}
button{margin-top:6px;font:inherit;font-size:14px;padding:9px 16px;border-radius:9px;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer}
</style>
</head>
<body>
<div class="c" id="c" role="status" aria-live="polite"><div class="i">…</div><h1>Um momento…</h1><p>Registrando o seu pedido.</p></div>
<script>
(function(){
  var FUNCAO='https://fmoskdxgjulagedzjxxk.supabase.co/functions/v1/disparos-sair';
  var c=document.getElementById('c');
  var t=(new URLSearchParams(location.search).get('t')||'').replace(/[^a-f0-9]/gi,'');
  function mostrar(ok,tit,txt,tentar){
    c.className='c '+(ok?'ok':'er');
    c.innerHTML='<div class="i">'+(ok?'✓':'!')+'</div><h1></h1><p></p>'+(tentar?'<button type="button">Tentar de novo</button>':'');
    c.querySelector('h1').textContent=tit;c.querySelector('p').textContent=txt;
    var b=c.querySelector('button');if(b)b.onclick=enviar;
  }
  function enviar(){
    if(t==='teste'){mostrar(true,'Pronto, você não vai mais receber nossos e-mails.','(Este era um e-mail de teste: nenhum endereço foi tirado da lista.)');return;}
    if(t.length<32){mostrar(false,'Link incompleto','Copie o link inteiro do e-mail ou responda a mensagem com a palavra SAIR.');return;}
    fetch(FUNCAO,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:t})})
      .then(function(r){return r.json().catch(function(){return {ok:false,erro:'Resposta inesperada do servidor (erro '+r.status+').'};});})
      .then(function(d){
        if(d&&d.ok)mostrar(true,'Pronto, você não vai mais receber nossos e-mails.','Seu endereço foi retirado da nossa lista. Se mudar de ideia, é só responder a qualquer e-mail nosso.');
        else mostrar(false,'Não deu certo',(d&&d.erro)||'Tente de novo ou responda o e-mail com a palavra SAIR.',true);
      })
      .catch(function(e){mostrar(false,'Sem conexão','Não consegui falar com o servidor ('+(e&&e.message||'erro de rede')+'). Tente de novo ou responda o e-mail com a palavra SAIR.',true);});
  }
  enviar();
})();
</script>
</body>
</html>
