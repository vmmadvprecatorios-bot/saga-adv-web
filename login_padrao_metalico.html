// Fundo animado: rede de pontos de luz na cor do tema. Parado com "Efeitos de movimento" desligado
// (Configurações > Preferências) ou com "reduzir movimento" do aparelho; para quando a aba fica escondida.
(function(){
  var c=document.getElementById('fx'),x=c.getContext&&c.getContext('2d');if(!x)return;
  var W,H,p=[],dpr=Math.min(1.5,window.devicePixelRatio||1),ult=0;
  var parado=document.documentElement.classList.contains('sem-movimento')||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  function medir(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);p=[];
    var n=Math.round(46*Math.min(1.5,Math.max(.4,W*H/(1280*720))));for(var i=0;i<n;i++)p.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3});}
  function cor(){var v=getComputedStyle(document.documentElement).getPropertyValue('--brilho').trim(),n=parseInt(v.replace('#',''),16);return isNaN(n)?'90,169,255':[n>>16&255,n>>8&255,n&255].join(',');}
  function quadro(t){
    if(!parado&&t-ult<33){requestAnimationFrame(quadro);return;}ult=t; // no máximo 30 quadros por segundo
    var k=cor(),cl=document.documentElement.getAttribute('data-theme')==='light';x.clearRect(0,0,W,H);
    for(var i=0;i<p.length;i++){var a=p[i];
      if(!parado){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1;}
      for(var j=i+1;j<p.length;j++){var b=p[j],d=Math.hypot(a.x-b.x,a.y-b.y);
        if(d<150){x.strokeStyle='rgba('+k+','+((1-d/150)*(cl?.25:.35)).toFixed(3)+')';x.lineWidth=1;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}}
      x.fillStyle='rgba('+k+','+(cl?.5:.8)+')';x.beginPath();x.arc(a.x,a.y,1.8,0,6.2832);x.fill();}
    if(!parado&&!document.hidden)requestAnimationFrame(quadro);
  }
  addEventListener('resize',function(){medir();if(parado)quadro(0);});
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&!parado)requestAnimationFrame(quadro);});
  medir();requestAnimationFrame(function(t){quadro(t);c.classList.add('ligado');});
})();

</script>

    if (r.data && r.data.session) {
      if (await contaLiberada()) {
        try { localStorage.setItem('saga-ultima-atividade', String(Date.now())); } catch (e) {}
        // volta do login pelo Google: aplica a escolha feita antes de sair para o Google
        if (sessionStorage.getItem('saga-login-agora') === 'google') await gravarManterConectado(localStorage.getItem('saga-manter-conectado-escolha') === '1');
        window.location.replace(await telaInicial());
        return;
      }
    }
  } catch (e) {
    // Silencioso: falha aqui nao bloqueia o login
  }
  document.documentElement.classList.remove('saga-entrando');
  mostrarBotaoGoogle();
})();

// Logo do escritorio (guardado no navegador desde o ultimo acesso) no lugar do escudo
(function () {
  var logo = null; try { logo = localStorage.getItem('saga-logo'); } catch (e) {}
  if (!logo || !/^(data:image\/|https:\/\/)/.test(logo)) return;
  var topo = document.querySelector('.marca-topo');
  if (!topo) return;
  var img = document.createElement('img');
  img.className = 'logo-escritorio'; img.alt = 'Logo do escritório'; img.src = logo;
  topo.replaceChildren(img);
})();

// Volta para a autorização do conector do SAGA no Claude (bloco 151): só esse destino (nunca endereço de fora).
// Guardado na aba para sobreviver à ida e volta do login com o Google.
function destinoVolta() {
  var v = '';
  try { v = new URLSearchParams(window.location.search).get('voltar') || sessionStorage.getItem('saga-voltar') || ''; } catch (e) {}
  if (/^autorizar_conector\.html\?authorization_id=[A-Za-z0-9_-]{8,200}$/.test(v)) { try { sessionStorage.setItem('saga-voltar', v); } catch (e) {} return v; }
  // 14/11 (bloco 202): link de envio de documento pedido ao Claude; depois do login a pessoa volta para ele
  if (/^enviar_documento\.html\?t=[0-9a-f]{36}$/.test(v)) { try { sessionStorage.setItem('saga-voltar', v); } catch (e) {} return v; }
  return '';
}
destinoVolta();
async function telaInicial() {
  var volta = destinoVolta();
  var destino = await telaInicialPadrao();
  if (volta) { try { sessionStorage.removeItem('saga-voltar'); } catch (e) {} return volta; }
  return destino;
}
// Primeira tela depois de entrar: sempre o Ponto (regra do escritório, 09/11); aqui só se aproveita para trazer o tamanho da letra
async function telaInicialPadrao() {
  try {
    var s = await _sb.auth.getSession();
    var id = s.data && s.data.session && s.data.session.user.id;
    if (!id) return TELA_POS_LOGIN;
    var r = await _sb.from('usuarios').select('preferencias,tema_preferido').eq('auth_user_id', id).maybeSingle();
    var letra = r.data && r.data.preferencias && r.data.preferencias.letra;
    try { if (letra) localStorage.setItem('saga-letra', String(letra)); } catch (e) {}
    return TELA_POS_LOGIN;
  } catch (e) { return TELA_POS_LOGIN; }
}

// "Manter conectado" (21/11): fica SÓ neste aparelho (saga-manter-conectado = {u: id do login}); o saga_ui.js
// só usa para o administrador e os isentos do login diário (login_regras.isento).
async function gravarManterConectado(marcado) {
  try {
    if (marcado === undefined) marcado = document.getElementById('manterConectado').checked;
    var s = await _sb.auth.getSession();
    var id = s.data && s.data.session && s.data.session.user.id;
    if (marcado && id) localStorage.setItem('saga-manter-conectado', JSON.stringify({ u: id, desde: Date.now() }));
    else localStorage.removeItem('saga-manter-conectado');
  } catch (e) {}
}
// a caixinha começa como ficou da última vez neste aparelho
try { if (localStorage.getItem('saga-manter-conectado')) document.getElementById('manterConectado').checked = true; } catch (e) {}

// Confere se a conta logada pertence a alguem da equipe e esta ativa
// (liga a conta ao pre-cadastro pelo e-mail no primeiro acesso pelo Google)
async function contaLiberada() {
  try {
    var v = await _sb.rpc('vincular_minha_conta');
    if (v.error) return true; // falha de rede: as telas internas conferem de novo
    if (v.data && v.data.ok) return true;
    await _sb.auth.signOut({ scope: 'local' });
    showToast(v.data && v.data.motivo === 'desligado' ? MSG_ACESSO_DESATIVADO : 'Este e-mail não está cadastrado na equipe do escritório. Fale com o administrador.', 'erro');
    return false;
  } catch (e) { return true; }
}

// Botao "Entrar com Google": so aparece se o provedor estiver ligado no Supabase
async function mostrarBotaoGoogle() {
  try {
    var r = await fetch(SUPABASE_URL + '/auth/v1/settings', { headers: { apikey: SUPABASE_KEY } });
    var cfg = await r.json();
    if (cfg && cfg.external && cfg.external.google) document.getElementById('blocoGoogle').hidden = false;
  } catch (e) {}
}
document.getElementById('btnGoogle').addEventListener('click', async function () {
  var btn = this;
  btn.disabled = true;
  var volta = window.location.href.split('?')[0].split('#')[0];
  try { sessionStorage.setItem('saga-login-agora', 'google'); } catch (e) {}
  try { localStorage.setItem('saga-manter-conectado-escolha', document.getElementById('manterConectado').checked ? '1' : '0'); } catch (e) {}
  var r = await _sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: volta, queryParams: { prompt: 'select_account' } } });
  if (r.error) { btn.disabled = false; try { sessionStorage.removeItem('saga-login-agora'); } catch (e) {} mostrarErroLogin('Não foi possível abrir o login do Google' + (r.error.message ? ' (' + r.error.message + ')' : '') + '. Tente de novo.'); }
});

// ================================================================
// LOGIN — formulario principal
// ================================================================
document.getElementById('formLogin').addEventListener('submit', async function (e) {
  e.preventDefault();

  var email = document.getElementById('loginEmail').value.trim();
  var senha = document.getElementById('loginSenha').value;
  var btn   = document.getElementById('btnEntrar');

  mostrarErroLogin('');
  if (!email || !senha) {
    mostrarErroLogin('Digite o seu e-mail e a sua senha para entrar.');
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'Conferindo...';

  try {
    var r = await _sb.auth.signInWithPassword({ email: email, password: senha });

    if (r.error) {
      var msg = 'Não foi possível entrar agora (' + (r.error.status ? 'erro ' + r.error.status + ': ' : '') + (r.error.message || 'sem detalhe') + '). Tente de novo.';
      var em  = r.error.message || '';
      if (em.indexOf('Invalid login credentials') >= 0) {
        msg = 'E-mail ou senha não conferem. Confira e tente de novo, ou use "Esqueci a senha".';
      } else if (em.indexOf('Email not confirmed') >= 0) {
        msg = 'Este e-mail ainda não foi confirmado. Procure o e-mail de confirmação na sua caixa de entrada (e no spam).';
      } else if (em.indexOf('Too many requests') >= 0) {
        msg = 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.';
      } else if (em.indexOf('User not found') >= 0) {
        msg = 'Não achei usuário com este e-mail. Confira o e-mail digitado.';
      } else if (/banned/i.test(em)) {
        msg = MSG_ACESSO_DESATIVADO;
      }
      mostrarErroLogin(msg);
      btn.disabled    = false;
      btn.textContent = 'Entrar';
      return;
    }

    // Colaborador desligado (inativo) ou fora da equipe nao entra, mesmo com a senha certa
    if (!(await contaLiberada())) {
      btn.disabled    = false;
      btn.textContent = 'Entrar';
      return;
    }

    // Marca a entrada como atividade, para a contagem de inatividade do saga_ui.js
    try { localStorage.setItem('saga-ultima-atividade', String(Date.now())); } catch (e) {}
    await gravarManterConectado();
    // Entrada no sistema (bloco 157): a 1ª tela grava este login com a hora do servidor
    try { sessionStorage.setItem('saga-login-agora', 'senha'); } catch (e) {}
    btn.textContent = 'Entrando...';
    showToast('Acesso autorizado. Abrindo o SAGA...', 'sucesso');
    var destino = await telaInicial();
    setTimeout(function () {
      window.location.href = destino;
    }, 800);

  } catch (ex) {
    mostrarErroLogin('Sem conexão com o servidor do SAGA. Confira a internet deste computador e tente de novo.');
    btn.disabled    = false;
    btn.textContent = 'Entrar';
  }
});

// ================================================================
document.getElementById('linkEsqueciSenha').addEventListener('click', function (e) {
  e.preventDefault();
  // Pre-preencher o e-mail se ja digitado no formulario principal
  var emailExistente = document.getElementById('loginEmail').value.trim();
  if (emailExistente) {
    document.getElementById('recoveryEmail').value = emailExistente;
  }
  document.getElementById('modalRecuperacao').classList.add('aberto');
  document.getElementById('recoveryEmail').focus();
});

document.getElementById('btnFecharRecuperacao').addEventListener('click', function () {
  document.getElementById('modalRecuperacao').classList.remove('aberto');
});

// Fechar clicando fora do card
document.getElementById('modalRecuperacao').addEventListener('click', function (e) {
  if (e.target === this) { this.classList.remove('aberto'); }
});

// ESC fecha o modal
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    document.getElementById('modalRecuperacao').classList.remove('aberto');
  }
});

// ================================================================
// RECUPERACAO DE SENHA — envio do link
// ================================================================
document.getElementById('formRecuperacao').addEventListener('submit', async function (e) {
  e.preventDefault();

  var email = document.getElementById('recoveryEmail').value.trim();
  var btn   = document.getElementById('btnEnviarRecuperacao');

  if (!email) {
    showToast('Digite o seu e-mail para receber o link de redefinição.', 'erro');
    return;
  }

  // URL de callback: a tela de redefinicao de senha.
  // IMPORTANTE: para funcionar, os arquivos devem ser servidos via HTTP
  // (ex: VS Code Live Server em http://127.0.0.1:5500/) e esse endereco
  // deve estar em: Supabase > Authentication > URL Configuration > Redirect URLs
  var resetUrl = window.location.href.replace(/\/[^\/]*(\?.*)?$/, '/reset_senha_padrao_metalico.html');

  btn.disabled    = true;
  btn.textContent = 'Enviando...';

  try {
    var r = await _sb.auth.resetPasswordForEmail(email, { redirectTo: resetUrl });

    if (r.error) {
      showToast('Não foi possível enviar o e-mail (' + (r.error.message || 'sem detalhe') + '). Confira o endereço e tente de novo.', 'erro');
      btn.disabled    = false;
      btn.textContent = 'Enviar link';
      return;
    }

    document.getElementById('modalRecuperacao').classList.remove('aberto');
    btn.disabled    = false;
    btn.textContent = 'Enviar link';
    showToast('Pronto. Se o e-mail estiver cadastrado, o link chega em alguns minutos (confira também o spam).', 'sucesso');

  } catch (ex) {
    showToast('Sem conexão com o servidor. Tente de novo em alguns instantes.', 'erro');
    btn.disabled    = false;
    btn.textContent = 'Enviar link';
  }
});
