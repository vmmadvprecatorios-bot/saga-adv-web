<style>
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
body{min-height:100vh;background:linear-gradient(160deg,var(--navy-1),var(--navy-2) 50%,var(--navy-3));color:var(--text);font-family:Montserrat,Arial,sans-serif;overflow-x:hidden}
.app{display:flex;position:relative;z-index:1}
.content{flex:1;padding:27px 28px 42px;min-width:0;min-height:calc(100vh - 64px)}
.overlay{display:none}.overlay.aberto{display:block}
.caixa{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}#area{display:flex;flex-direction:column;gap:12px}
h1{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;line-height:1.1}
.sub{color:var(--muted);font-size:12.5px;line-height:1.55}
.cartao{border:1px solid var(--border-soft);border-radius:16px;background:var(--panel);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.destino{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.destino dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding-top:2px}
.destino dd{min-width:0;overflow-wrap:anywhere}
.cod{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;color:var(--gold-light)}
label.rot{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600}
select{height:40px;border-radius:10px;border:1px solid var(--border-soft);background:var(--panel-solid);padding:0 10px;font-size:13px;color:var(--text);width:100%}
.solta{border:2px dashed var(--border);border-radius:16px;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;transition:border-color .24s cubic-bezier(.22,.78,.25,1),background .24s cubic-bezier(.22,.78,.25,1)}
.solta.sobre{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,transparent)}
.btn-grande{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:54px;padding:0 26px;border-radius:14px;font-size:15px;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);background:color-mix(in srgb,var(--gold) 14%,var(--panel));color:var(--text);transition:transform .2s cubic-bezier(.22,.78,.25,1)}
.btn-grande:active{transform:scale(.97)}.btn-grande:disabled{opacity:.45;cursor:default}
.ajuda{font-size:11.5px;color:var(--muted);line-height:1.5}
.lista{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;border:1px solid var(--border-soft);border-radius:12px;padding:10px 12px;font-size:12.5px}
.item .nome{overflow-wrap:anywhere}
.item .st{font-size:11.5px;color:var(--muted);white-space:nowrap}
.item .st.ok{color:var(--success,#2e9e6b)}.item .st.erro{color:var(--danger,#c0392b);white-space:normal;grid-column:1/-1}
.barra{grid-column:1/-1;height:5px;border-radius:4px;background:var(--border-soft);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s cubic-bezier(.22,.78,.25,1)}
.aviso-erro{border:1px solid color-mix(in srgb,var(--danger,#c0392b) 50%,transparent);background:color-mix(in srgb,var(--danger,#c0392b) 10%,transparent);color:var(--text);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5}
.lnk{font-size:12px;color:var(--text);text-decoration:none;border:1px solid var(--border-soft);border-radius:9px;padding:7px 12px;align-self:flex-start}
.lnk:hover{border-color:var(--gold)}
html.sem-movimento .barra i,html.sem-movimento .solta,html.sem-movimento .btn-grande{transition:none}
@media(max-width:760px){.content{padding:18px 14px 34px}h1{font-size:27px}.destino{grid-template-columns:1fr}.destino dt{padding-top:6px}}
</style>

    </div>

  </div>
</main>
</div>

<script>

var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtb3NrZHhnanVsYWdlZHpqeHhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NzIyOTEsImV4cCI6MjA5NzQ0ODI5MX0.HstSu8-hw9GC7k3wZPhybYi-gA3W4bmQpeeVcoGqYq8';

<script src="saga_ui.js?v=202611141337"></script>
<script>
/* =====================================================================
   SAGA · Enviar documento (bloco 202; 14/11/2026, pedido do Dr. Victor)
   Link criado pelo Claude (conector SAGA no Claude, preparar_envio_de_arquivo): enviar_documento.html?t=<token>.
   A pessoa escolhe o arquivo (celular ou computador); ele sobe com o login dela para documentos-clientes/<processo>/...,
   como na ficha, e é registrado pela documento_envio_concluir (Documentos do processo + Registro de atividades).
   O link vale 24 h e só para quem o pediu ao Claude.
   ===================================================================== */
var BUCKET='documentos-clientes',MAX=50*1024*1024;
var TIPOS={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',heic:'image/heic',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xls:'application/vnd.ms-excel',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',odt:'application/vnd.oasis.opendocument.text',txt:'text/plain',csv:'text/csv',md:'text/markdown'};
var E={token:null,dados:null,pasta:null,enviando:0};
function $(id){return document.getElementById(id);}
function h(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function tam(b){b=Number(b)||0;return b>=1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB';}
function quando(iso){try{return new Date(iso).toLocaleString('pt-BR',{timeZone:'America/Maceio',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function reduzido(){try{return localStorage.getItem('saga-movimento')==='reduzido';}catch(e){return false;}}
function erroTela(t){$('area').innerHTML='<div class="aviso-erro"><b>Não foi possível abrir o envio.</b><br>'+h(t)+'</div>';}
function caminhoPastas(p){var mapa={};(E.dados.pastas||[]).forEach(function(x){mapa[x.id]=x;});var nomes=[],x=p,i=0;while(x&&i<10){nomes.unshift(x.nome);x=mapa[x.pai_id];i++;}return nomes.join(' / ');}
function desenhar(){
  var d=E.dados;
  var pastas=(d.pastas||[]).map(function(p){return {id:p.id,nome:caminhoPastas(p)};}).sort(function(a,b){return a.nome.localeCompare(b.nome,'pt-BR');});
  var ficha='ficha_cliente_padrao_metalico_FINAL.html?processo_id='+encodeURIComponent(d.processo_id)+'';
  $('area').innerHTML=
    '<div class="cartao"><dl class="destino">'+
      '<dt>Cliente</dt><dd>'+h(d.cliente||'—')+(d.cliente_codigo?' <span class="cod">'+h(d.cliente_codigo)+'</span>':'')+'</dd>'+
      '<dt>Processo</dt><dd>'+(d.processo_codigo?'<span class="cod">'+h(d.processo_codigo)+'</span> ':'')+h(d.processo_numero||'')+'</dd>'+
      (d.nome_sugerido?'<dt>Arquivo</dt><dd>'+h(d.nome_sugerido)+'</dd>':'')+
    '</dl>'+
    '<label class="rot" for="selPasta">Pasta da ficha</label><select id="selPasta"><option value="">Documentos (sem pasta)</option>'+pastas.map(function(p){return '<option value="'+h(p.id)+'"'+(String(p.id)===String(d.pasta_id||'')?' selected':'')+'>'+h(p.nome)+'</option>';}).join('')+'</select>'+
    '<p class="ajuda">Vale até '+h(quando(d.expira_em))+' (24 h desde o pedido ao Claude).</p></div>'+
    (d.expirado?'<div class="aviso-erro"><b>Este link de envio venceu.</b> Peça um link novo ao Claude ("preciso mandar o arquivo de novo").</div>':
    '<div class="cartao solta" id="solta"><button class="btn-grande" type="button" id="btnEscolher">⬆ Escolher arquivo</button>'+
      '<input type="file" id="arq" multiple hidden accept=".pdf,.png,.jpg,.jpeg,.webp,.heic,.doc,.docx,.xls,.xlsx,.odt,.txt,.csv,.md,image/*,application/pdf">'+
      '<p class="ajuda">No celular: escolha da galeria, da câmera ou dos arquivos. No computador: escolha ou arraste o arquivo para cá. Até 50 MB por arquivo; pode mandar vários.</p></div>')+
    '<div class="lista" id="lista">'+(d.enviados||[]).map(function(x){return '<div class="item"><span class="nome">'+h(x.nome)+'</span><span class="st ok">✓ Guardado · '+h(tam(x.tamanho))+'</span></div>';}).join('')+'</div>'+
    '<a class="lnk" href="'+h(ficha)+'">Abrir a ficha do cliente ↗</a>';
  var b=$('btnEscolher'),inp=$('arq'),zona=$('solta');
  if(b){b.onclick=function(){inp.click();};inp.onchange=function(){enviarVarios(inp.files);inp.value='';};
    ['dragenter','dragover'].forEach(function(t){zona.addEventListener(t,function(e){e.preventDefault();zona.classList.add('sobre');});});
    ['dragleave','drop'].forEach(function(t){zona.addEventListener(t,function(e){e.preventDefault();zona.classList.remove('sobre');});});
    zona.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files)enviarVarios(e.dataTransfer.files);});}
}
function linhaNova(nome){
  var el=document.createElement('div');el.className='item';el.innerHTML='<span class="nome">'+h(nome)+'</span><span class="st">Enviando…</span><div class="barra"><i></i></div>';
  $('lista').appendChild(el);
  if(!reduzido()&&el.animate)el.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:260,easing:'cubic-bezier(.22,.78,.25,1)'});
  return el;
}
async function enviarVarios(lista){var arr=Array.prototype.slice.call(lista||[]);for(var i=0;i<arr.length;i++)await enviar(arr[i]);}
async function enviar(file){
  var el=linhaNova(file.name||'arquivo'),st=el.querySelector('.st'),bar=el.querySelector('.barra i');
  var falhou=function(t){st.className='st erro';st.textContent='Não foi guardado: '+t;bar.parentNode.remove();};
  var ext=(String(file.name||'').match(/\.([A-Za-z0-9]{1,5})$/)||[])[1];ext=ext?ext.toLowerCase():'';
  if(!TIPOS[ext])return falhou('tipo de arquivo não aceito (.'+(ext||'?')+'). Aceitos: '+Object.keys(TIPOS).join(', ')+'.');
  if(file.size>MAX)return falhou('o arquivo tem '+tam(file.size)+'; o máximo é 50 MB.');
  if(!file.size)return falhou('o arquivo está vazio.');
  var caminho=E.dados.processo_id+'/'+crypto.randomUUID()+'_'+String(file.name).replace(/[^a-zA-Z0-9._-]/g,'_');
  bar.style.width='35%';
  var up=await _sb.storage.from(BUCKET).upload(caminho,file,{contentType:file.type||TIPOS[ext],upsert:false});
  if(up.error)return falhou((up.error.message||'erro no envio')+(up.error.statusCode?' (código '+up.error.statusCode+')':'')+'. Tente de novo.');
  bar.style.width='80%';
  var pasta=$('selPasta')?$('selPasta').value||null:null;
  var r=await _sb.rpc('documento_envio_concluir',{p_token:E.token,p_nome:file.name,p_caminho:caminho,p_tamanho:file.size,p_pasta_id:pasta});
  if(r.error){try{await _sb.storage.from(BUCKET).remove([caminho]);}catch(e){}return falhou(r.error.message||'erro ao registrar');}
  bar.style.width='100%';
  setTimeout(function(){if(bar.parentNode)bar.parentNode.remove();st.className='st ok';st.textContent='✓ Guardado · '+tam(file.size);},320);
}
async function init(){
  try{E.token=new URLSearchParams(location.search).get('t');}catch(e){}
  if(!E.token||!/^[0-9a-f]{36}$/.test(E.token)){erroTela('O link está incompleto. Abra de novo o link que o Claude mandou.');return;}
  var s=await _sb.auth.getSession();
  if(!s.data||!s.data.session){location.href='login_padrao_metalico.html?voltar='+encodeURIComponent('enviar_documento.html?t='+E.token);return;}
  try{if(reduzido())document.documentElement.classList.add('sem-movimento');}catch(e){}
  await SagaUI.carregar('enviar_documento');
  var r=await _sb.rpc('documento_envio_ler',{p_token:E.token});
  if(r.error){erroTela(r.error.message||'erro desconhecido');return;}
  E.dados=r.data;desenhar();
}
init().catch(function(e){erroTela((e&&e.message)||'Erro ao abrir a tela.');});
</script>
</body>
</html>
