<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>VMMADV | Manual do SAGA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Manual do SAGA (POP-SAGA-001). Conteúdo em manual/conteudo.js; prints em manual/img; PDF em manual/POP_SAGA_ADV.pdf.
   --mn-marca é a mesma cor laranja das marcas desenhadas nos prints (igual nos dois temas e nas duas cores).
   11/11 (Dr. Victor): capítulos e partes começam fechados (abre um por vez ou tudo de uma vez); o índice recolhe
   cada capítulo e recolhe inteiro para a esquerda (só os números; abre ao passar o mouse). */
:root{--mn-marca:#ea580c;--curva:cubic-bezier(.22,.78,.25,1)}
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;color:inherit}
body{min-height:100vh;background:linear-gradient(160deg,var(--navy-1),var(--navy-2) 50%,var(--navy-3));color:var(--text);font-family:Montserrat,Arial,sans-serif;overflow-x:hidden}
.app{display:flex;position:relative;z-index:1}
.content{flex:1;padding:27px 28px 60px;min-width:0;min-height:calc(100vh - 64px)}
.overlay{display:none}.overlay.aberto{display:block}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;line-height:1.1}
.page-head p{color:var(--muted);font-size:12.5px;margin-top:5px;max-width:82ch;line-height:1.55}
.page-head .selo{display:inline-flex;gap:6px;align-items:center;margin-top:8px;font-size:11px;color:var(--muted)}
.page-head .selo b{font-weight:600;color:var(--text)}
.botoes{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:11px;font-size:12px;border:1px solid var(--border-soft);background:var(--panel);text-decoration:none;color:var(--text);transition:transform .15s,border-color .15s,background .15s}
.btn:active{transform:scale(.96)}
.btn svg{flex:0 0 auto}

.mn-busca-barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.mn-busca{position:relative;flex:1 1 360px;max-width:560px}
.mn-busca input{width:100%;height:40px;border-radius:12px;border:1px solid var(--border-soft);background:var(--panel-solid);padding:0 38px 0 38px;font-size:13px;outline:0;transition:border-color .2s}
.mn-busca input:focus{border-color:var(--gold)}
.mn-busca input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.mn-busca .lupa{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.mn-busca .limpar{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:8px;color:var(--muted)}
.mn-busca .limpar:hover{background:var(--panel)}
.mn-resultado{font-size:12px;color:var(--muted)}
.mn-tudo{display:flex;gap:6px;margin-left:auto}
.mn-tudo .btn{height:34px;padding:0 12px;font-size:11.5px}
.mn-ir{display:none;height:38px;border-radius:11px;border:1px solid var(--border-soft);background:var(--panel-solid);padding:0 10px;font-size:12.5px;width:100%}

/* grade: índice + conteúdo */
.mn-grade{display:grid;grid-template-columns:248px minmax(0,1fr);gap:22px;align-items:start;transition:grid-template-columns .32s var(--curva)}
.mn-grade.ind-recolhido{grid-template-columns:54px minmax(0,1fr)}

/* índice */
.mn-indice{position:sticky;top:78px;z-index:30;width:100%;max-height:calc(100vh - 96px);overflow:auto;border:1px solid var(--border-soft);border-radius:14px;background:var(--panel);padding:8px;scrollbar-width:thin;transition:width .32s var(--curva),box-shadow .32s var(--curva),padding .32s var(--curva)}
.mn-indice [hidden]{display:none!important}
.mn-ind-cab{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:2px 2px 6px 8px;min-height:34px}
.mn-ind-cab .tit{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.mn-ind-acoes{display:flex;gap:2px}
.mn-ico{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid transparent;transition:background .2s var(--curva),color .2s,border-color .2s}
.mn-ico:hover{color:var(--text);background:color-mix(in srgb,var(--gold) 10%,transparent);border-color:var(--border-soft)}
.mn-ico svg{transition:transform .32s var(--curva)}
.mn-ico.virado svg{transform:rotate(180deg)}
.mn-indice a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-size:12px;line-height:1.35;padding:5px 8px;border-radius:8px;border:1px solid transparent;min-width:0;transition:background .2s var(--curva),color .2s,border-color .2s}
.mn-indice a:hover{background:color-mix(in srgb,var(--gold) 8%,transparent);color:var(--text)}
.mn-indice a.active{background:color-mix(in srgb,var(--gold) 14%,transparent);border-color:color-mix(in srgb,var(--gold) 35%,transparent);color:var(--text)}
.mn-ind-linha{display:flex;align-items:center;gap:2px;margin-top:2px}
.mn-ind-linha a.cap{flex:1;color:var(--text);font-weight:600}
.mn-ind-n{flex:0 0 24px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--gold);background:color-mix(in srgb,var(--gold) 11%,transparent);font-variant-numeric:tabular-nums;transition:background .2s var(--curva),color .2s}
.mn-indice a.atual .mn-ind-n{background:var(--gold);color:var(--panel-solid)}
.mn-ind-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mn-ind-sn{flex:0 0 auto;font-size:10.5px;color:var(--muted);opacity:.8;font-variant-numeric:tabular-nums;min-width:26px}
.mn-ind-seta{flex:0 0 26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.mn-ind-seta:hover{color:var(--text);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.mn-ind-seta svg{transition:transform .32s var(--curva)}
.mn-ind-grupo.fechado .mn-ind-seta svg{transform:rotate(-90deg)}
.mn-ind-secs{padding:0 0 4px 22px}
.mn-ind-secs a.sec{font-size:11.5px;padding:5px 8px}
/* índice recolhido para a esquerda: só os números; abre por cima do conteúdo ao passar o mouse */
/* (ao passar o mouse aparecem só os nomes dos capítulos, cada um no mesmo lugar: nada pula debaixo do mouse) */
.mn-indice.recolhido{overflow-x:hidden}
.mn-indice.recolhido [data-ind="grupos"],.mn-indice.recolhido .mn-ind-seta,.mn-indice.recolhido .mn-ind-secs{display:none}
.mn-indice.recolhido .mn-ind-t{white-space:nowrap}
.mn-indice.recolhido:not(.sobre){width:54px;padding:8px 6px}
.mn-indice.recolhido:not(.sobre) .mn-ind-cab{justify-content:center;padding:2px 0 6px}
.mn-indice.recolhido:not(.sobre) .mn-ind-cab .tit,.mn-indice.recolhido:not(.sobre) .mn-ind-t{display:none}
.mn-indice.recolhido:not(.sobre) .mn-ind-linha a.cap{justify-content:center;padding:5px 0}
.mn-indice.recolhido.sobre{width:270px;background:var(--panel-solid);box-shadow:var(--shadow,0 18px 50px rgba(0,0,0,.35))}

/* regras do escritório */
.mn-bloco{border:1px solid var(--border-soft);border-radius:16px;background:var(--panel);padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow-sm,none)}
.mn-bloco h2{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;line-height:1.15;margin-bottom:6px}
.mn-bloco .sub{font-size:12px;color:var(--muted);line-height:1.5}
.mn-sobre-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mn-sobre-corpo{margin-top:14px}
.mn-sobre-corpo h3,.mn-sec-corpo h4{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600;margin:16px 0 7px}
.mn-sobre-corpo h3:first-child{margin-top:0}
.mn-sobre-corpo p{font-size:13px;line-height:1.6}
.mn-tab{width:100%;border-collapse:collapse;font-size:12.5px}
.mn-tab td,.mn-tab th{padding:8px 10px;border-bottom:1px solid var(--border-soft);text-align:left;vertical-align:top;line-height:1.5}
.mn-tab th{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600}
.mn-tab td:first-child{font-weight:600;white-space:nowrap;width:1%}
.mn-regras{list-style:none;display:grid;gap:8px}
.mn-regras li{position:relative;padding:10px 12px 10px 34px;border:1px solid var(--border-soft);border-radius:11px;background:var(--panel-solid);font-size:13px;line-height:1.55}
.mn-regras li::before{content:"";position:absolute;left:13px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--gold)}

/* capítulos e partes (abrem e fecham) */
.mn-cap{margin:0 0 10px;scroll-margin-top:80px;border:1px solid var(--border-soft);border-radius:16px;background:var(--panel);transition:border-color .25s var(--curva)}
.mn-cap.aberto{border-color:color-mix(in srgb,var(--gold) 32%,var(--border-soft))}
.mn-cap-cab{width:100%;display:flex;align-items:center;gap:14px;padding:14px 18px;text-align:left;border-radius:15px;transition:background .2s var(--curva)}
.mn-cap-cab:hover{background:color-mix(in srgb,var(--gold) 5%,transparent)}
.mn-cap-cab .n{flex:0 0 auto;min-width:26px;text-align:center;font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:var(--gold);line-height:1}
.mn-cap-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mn-cap-tit{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:600;line-height:1.1}
.mn-cap-res{font-size:12.5px;color:var(--muted);line-height:1.5}
.mn-cap-res b{font-weight:600}
.mn-cap-cab .quem{flex:0 0 auto;font-size:11px;color:var(--muted);border:1px solid var(--border-soft);border-radius:999px;padding:3px 10px;background:var(--panel-solid);white-space:nowrap}
.mn-seta{flex:0 0 auto;color:var(--muted);transition:transform .32s var(--curva)}
.mn-cap:not(.aberto)>.mn-cap-cab .mn-seta,.mn-sec:not(.aberto)>.mn-sec-cab .mn-seta{transform:rotate(-90deg)}
.mn-cap-corpo{padding:0 14px 14px}
.mn-cap-acoes{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin:0 2px 2px}
.mn-cap-acoes button{height:28px;padding:0 10px;border-radius:8px;font-size:11.5px;color:var(--muted);border:1px solid var(--border-soft);background:var(--panel-solid);transition:color .2s,border-color .2s}
.mn-cap-acoes button:hover{color:var(--text);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.mn-sec{border:1px solid var(--border-soft);border-radius:13px;background:var(--panel-solid);margin-top:8px;scroll-margin-top:80px}
.mn-sec-cab{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left;border-radius:12px;transition:background .2s var(--curva)}
.mn-sec-cab:hover{background:color-mix(in srgb,var(--gold) 6%,transparent)}
.mn-sec-cab .n{flex:0 0 auto;min-width:30px;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.mn-sec-tit{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.35}
.mn-sec-corpo{padding:0 18px 18px}
.mn-quando{margin:2px 0 4px;padding:10px 14px;border-radius:11px;border-left:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--panel));font-size:13px;line-height:1.55}
.mn-quando b{font-weight:600}
.mn-passos{list-style:none;counter-reset:p;display:grid;gap:9px;margin-top:6px}
.mn-passos li{counter-increment:p;position:relative;padding-left:36px;font-size:13.5px;line-height:1.6}
.mn-passos li::before{content:counter(p);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;background:color-mix(in srgb,var(--gold) 15%,var(--panel-solid));border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);color:var(--text)}
.mn-passos b{font-weight:600}
.bt{display:inline-flex;align-items:center;height:21px;padding:0 8px;margin:0 1px;border-radius:7px;border:1px solid var(--border);background:var(--panel-solid);font-size:12px;font-weight:500;white-space:nowrap;vertical-align:1px;line-height:1}
.mn-fig{margin:16px 0 0;border:1px solid var(--border-soft);border-radius:13px;overflow:hidden;background:var(--panel-solid);position:relative}
.mn-fig button{display:block;width:100%;cursor:zoom-in;padding:0}
.mn-fig img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;background:color-mix(in srgb,var(--text) 5%,transparent)}
.mn-fig .lupa-fig{position:absolute;right:10px;top:10px;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:8px;font-size:11px;background:color-mix(in srgb,var(--panel-solid) 88%,transparent);border:1px solid var(--border-soft);color:var(--text);pointer-events:none;opacity:0;transition:opacity .2s}
.mn-fig:hover .lupa-fig{opacity:1}
.mn-legenda{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:7px 16px;margin-top:12px}
.mn-legenda li{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.5}
.mn-num{flex:0 0 22px;height:22px;border-radius:50%;background:var(--mn-marca);color:#fff;font-weight:700;font-size:11.5px;display:inline-flex;align-items:center;justify-content:center;margin-top:-1px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mn-nota{margin-top:12px;padding:10px 14px 10px 40px;border-radius:11px;font-size:12.8px;line-height:1.55;position:relative}
.mn-nota::before{position:absolute;left:14px;top:9px;font-size:14px}
.mn-nota.dica{background:color-mix(in srgb,var(--success,#16a34a) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--success,#16a34a) 28%,transparent)}
.mn-nota.dica::before{content:"💡"}
.mn-nota.atencao{background:color-mix(in srgb,var(--danger,#dc2626) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--danger,#dc2626) 26%,transparent)}
.mn-nota.atencao::before{content:"⚠️"}
.mn-nota p+p{margin-top:5px}
.mn-duvidas{display:grid;gap:8px;margin-top:8px}
.mn-duvidas details{border:1px solid var(--border-soft);border-radius:12px;background:var(--panel-solid);padding:0 14px}
.mn-duvidas summary{cursor:pointer;list-style:none;padding:12px 0;font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.mn-duvidas summary::-webkit-details-marker{display:none}
.mn-duvidas summary::after{content:"+";color:var(--muted);font-weight:500;transition:transform .3s var(--curva)}
.mn-duvidas details[open] summary::after{transform:rotate(45deg)}
.mn-duvidas .resp{padding:0 0 12px;font-size:13px;line-height:1.6;color:var(--text)}
.mn-vazio{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--border);border-radius:14px}

/* imagem ampliada */
.mn-zoom{position:fixed;inset:0;z-index:4000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(8,14,26,.78);opacity:0;transition:opacity .26s var(--curva);cursor:zoom-out}
.mn-zoom.aberto{opacity:1}
.mn-zoom img{max-width:min(1600px,100%);max-height:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.45);transform:scale(.96);transition:transform .32s var(--curva);background:#fff}
.mn-zoom.aberto img{transform:none}
.mn-zoom .fechar{position:absolute;right:16px;top:14px;width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.14);color:#fff;font-size:18px}
html.sem-movimento :is(.mn-zoom,.mn-zoom img,.mn-indice,.mn-indice a,.mn-indice svg,.mn-grade,.mn-seta,.mn-cap,.mn-cap-cab,.mn-sec-cab,.mn-duvidas summary::after){transition:none}

@media(max-width:1000px){
  .mn-grade,.mn-grade.ind-recolhido{grid-template-columns:minmax(0,1fr)}
  .mn-indice{display:none}
  .mn-ir{display:block}
}
@media(max-width:760px){
  .content{padding:18px 14px 40px}.page-head h1{font-size:27px}
  .mn-bloco{padding:14px 14px 16px;border-radius:14px}
  .mn-cap-cab{padding:12px;gap:10px}.mn-cap-cab .quem{display:none}.mn-cap-tit{font-size:21px}.mn-cap-cab .n{font-size:24px;min-width:20px}
  .mn-cap-corpo{padding:0 8px 10px}.mn-sec-corpo{padding:0 12px 14px}.mn-sec-tit{font-size:14px}
  .mn-tudo{margin-left:0}
  .mn-tab td:first-child{white-space:normal}
  .mn-tab tr{display:grid}.mn-tab td{border-bottom:0;padding:4px 0}.mn-tab tr{border-bottom:1px solid var(--border-soft);padding:6px 0}
  .botoes{width:100%}.botoes .btn{flex:1}
}
</style>

<script>
/* =====================================================================
   SAGA · Manual do SAGA (POP-SAGA-001). Lê window.SAGA_MANUAL (manual/conteudo.js).
   manual.html?tela=<tela> abre no capítulo daquela tela (menu da foto > Manual do SAGA);
   manual.html#<capitulo>-<secao> abre direto numa parte.

/* ---------- abrir e fechar capítulos e partes ---------- */
function corpoDe(bloco){return bloco?bloco.querySelector(':scope > .mn-cap-corpo, :scope > .mn-sec-corpo'):null;}
function estaAberto(bloco){return !!bloco&&bloco.classList.contains('aberto');}
function abrirBloco(bloco,abrir,animar,fim){
  var c=corpoDe(bloco);if(!c){if(fim)fim();return;}
  var cab=bloco.querySelector(':scope > .mn-cap-cab, :scope > .mn-sec-cab');
  bloco.classList.toggle('aberto',abrir);if(cab)cab.setAttribute('aria-expanded',abrir?'true':'false');
  if(!c.hidden===abrir&&!c._recolhendo){if(fim)fim();return;}
  if(animar&&window.sagaRecolher&&!semMov())window.sagaRecolher(c,!abrir,fim);
  else{c.hidden=!abrir;if(fim)fim();}
}
function partes(cap,abrir){
  cap.querySelectorAll('.mn-sec').forEach(function(s){abrirBloco(s,abrir,true);});
  cap.querySelectorAll('.mn-duvidas details').forEach(function(d){d.open=abrir;});
}
function abrirTudo(){
  document.querySelectorAll('#mnConteudo .mn-cap').forEach(function(cap){
    if(cap.hidden)return;
    var estava=estaAberto(cap);
    cap.querySelectorAll('.mn-sec').forEach(function(s){if(!s.hidden)abrirBloco(s,true,estava);});
    cap.querySelectorAll('.mn-duvidas details').forEach(function(d){d.open=true;});
    abrirBloco(cap,true,true);
  });
}
function fecharTudo(){
  document.querySelectorAll('#mnConteudo .mn-cap').forEach(function(cap){
    abrirBloco(cap,false,true,function(){
      cap.querySelectorAll('.mn-sec').forEach(function(s){abrirBloco(s,false,false);});
      cap.querySelectorAll('.mn-duvidas details').forEach(function(d){d.open=false;});
    });
  });
  var g=$('mnGrade'),y=g.getBoundingClientRect().top+window.scrollY-74;
  if(window.scrollY>y+10)rolarAte(Math.max(0,Math.round(y)),true);
}
// abre o capítulo (e a parte) do alvo antes de rolar até ele
function revelar(id){
  var el=$(id);if(!el)return null;
  if(el.classList.contains('mn-sec')){
    var cap=el.closest('.mn-cap');
    if(cap&&!estaAberto(cap))abrirBloco(cap,true,false);
    if(!estaAberto(el))abrirBloco(el,true,true);
  }else if(el.classList.contains('mn-cap')&&!estaAberto(el))abrirBloco(el,true,true);
  return el;
}

/* ---------- rolagem com a curva do sistema (cubic-bezier(.22,.78,.25,1), 420 ms); sem movimento: vai na hora ---------- */
function curva(t){
  var x1=.22,y1=.78,x2=.25,y2=1,s=t;
  for(var i=0;i<8;i++){var x=3*(1-s)*(1-s)*s*x1+3*(1-s)*s*s*x2+s*s*s-t,dx=3*(1-s)*(1-s)*x1+6*(1-s)*s*(x2-x1)+3*s*s*(1-x2);if(Math.abs(x)<1e-5||Math.abs(dx)<1e-6)break;s=Math.min(1,Math.max(0,s-x/dx));}
  return 3*(1-s)*(1-s)*s*y1+3*(1-s)*s*s*y2+s*s*s;
}
var animRolar=0;
function rolarAte(y,suave){
  cancelAnimationFrame(animRolar);
  var de=window.scrollY,dist=y-de;
  if(!suave||semMov()||Math.abs(dist)<2){window.scrollTo({top:y,behavior:'instant'});return;}
  var ini=performance.now(),dur=420;
  var passo=function(agora){var t=Math.min(1,(agora-ini)/dur);window.scrollTo({top:de+dist*curva(t),behavior:'instant'});if(t<1)animRolar=requestAnimationFrame(passo);};
  animRolar=requestAnimationFrame(passo);
}
function ir(id,suave){
  var el=revelar(id);if(!el)return;
  var y=el.getBoundingClientRect().top+window.scrollY-74;
  rolarAte(Math.max(0,Math.round(y)),suave);
  if(history.replaceState)history.replaceState(null,'',location.pathname+location.search.replace(/([?&])tela=[^&]*&?/,'$1').replace(/[?&]$/,'')+'#'+id);
}

/* ---------- índice: capítulos recolhíveis e índice recolhido para a esquerda ---------- */
function grupoIndice(id,abrir,animar){
  var g=document.querySelector('#mnIndice .mn-ind-grupo[data-grupo="'+id+'"]');if(!g)return;
  var lista=g.querySelector('.mn-ind-secs'),bt=g.querySelector('[data-ind-grupo]');
  g.classList.toggle('fechado',!abrir);if(bt)bt.setAttribute('aria-expanded',abrir?'true':'false');
  if(abrir)delete IND.grupos[id];else IND.grupos[id]=true;
  if(lista&&!(!lista.hidden===abrir&&!lista._recolhendo)){if(animar&&window.sagaRecolher&&!semMov())window.sagaRecolher(lista,!abrir);else lista.hidden=!abrir;}
}
function marcarBotaoGrupos(){
  var b=document.querySelector('#mnIndice [data-ind="grupos"]');if(!b)return;
  var algumAberto=Array.prototype.some.call(document.querySelectorAll('#mnIndice .mn-ind-grupo'),function(g){return !g.classList.contains('fechado');});
  b.classList.toggle('virado',!algumAberto);
  b.title=algumAberto?'Recolher os capítulos do índice':'Mostrar as partes de todos os capítulos';b.setAttribute('aria-label',b.title);
}
function aplicarLado(){
  var nav=$('mnIndice');if(!nav)return;
  nav.classList.toggle('recolhido',IND.recolhido);$('mnGrade').classList.toggle('ind-recolhido',IND.recolhido);
  if(!IND.recolhido)nav.classList.remove('sobre');
  var b=nav.querySelector('[data-ind="lado"]');
  if(b){b.classList.toggle('virado',IND.recolhido);b.title=IND.recolhido?'Deixar o índice sempre aberto':'Recolher o índice para a esquerda';b.setAttribute('aria-label',b.title);}
}
function ligarIndiceLado(){
  var nav=$('mnIndice'),t=null;
  nav.addEventListener('mouseenter',function(){if(!IND.recolhido)return;clearTimeout(t);t=setTimeout(function(){nav.classList.add('sobre');},90);});
  nav.addEventListener('mouseleave',function(){clearTimeout(t);t=setTimeout(function(){nav.classList.remove('sobre');},220);});
  nav.addEventListener('focusin',function(){if(IND.recolhido)nav.classList.add('sobre');});
  nav.addEventListener('focusout',function(e){if(!nav.contains(e.relatedTarget))nav.classList.remove('sobre');});
}

/* ---------- busca ---------- */
var tBusca=null,FOTO=null;
function foto(){
  var f={caps:[],secs:[],det:[]};
  document.querySelectorAll('#mnConteudo .mn-cap.aberto').forEach(function(c){f.caps.push(c.id);});
  document.querySelectorAll('#mnConteudo .mn-sec.aberto').forEach(function(s){f.secs.push(s.id);});
  document.querySelectorAll('.mn-duvidas details').forEach(function(d,i){if(d.open)f.det.push(i);});
  return f;
}
function restaurar(f){
  document.querySelectorAll('#mnConteudo .mn-cap').forEach(function(c){abrirBloco(c,f.caps.indexOf(c.id)>=0,false);});
  document.querySelectorAll('#mnConteudo .mn-sec').forEach(function(s){abrirBloco(s,f.secs.indexOf(s.id)>=0,false);});
  document.querySelectorAll('.mn-duvidas details').forEach(function(d,i){d.open=f.det.indexOf(i)>=0;});
}
function buscar(){
  var q=norm($('mnBusca').value.trim()),palavras=q.split(/\s+/).filter(Boolean),n=0,busca=!!palavras.length;
  $('mnLimpar').hidden=!q;
  if(busca&&!FOTO)FOTO=foto();
  // primeiro decide o que fica (a parte some com movimento e só fica "hidden" no fim, por isso não dá para ler s.hidden aqui)
  var fica={},capComAlgo={};
  document.querySelectorAll('.mn-sec,.mn-sec-duvida').forEach(function(s){
    var ok=!busca||palavras.every(function(p){return s.getAttribute('data-texto').indexOf(p)>=0;});
    if(ok){n++;var c=s.closest('.mn-cap');if(c)capComAlgo[c.id]=true;}
    if(s.id)fica[s.id]=ok;
    if(busca&&ok){if(s.classList.contains('mn-sec'))abrirBloco(s,true,false);else s.open=true;}
    if(ok===!s.hidden&&!s._recolhendo)return;
    if(window.sagaRecolher)window.sagaRecolher(s,!ok);else s.hidden=!ok;
  });
  // capítulo sem nenhuma parte que fica some inteiro; com resultado, abre
  document.querySelectorAll('#mnConteudo .mn-cap').forEach(function(c){
    var mostrar=!busca||!!capComAlgo[c.id];
    if(busca&&mostrar)abrirBloco(c,true,false);
    if(mostrar===!c.hidden&&!c._recolhendo)return;
    if(window.sagaRecolher)window.sagaRecolher(c,!mostrar);else c.hidden=!mostrar;
  });
  var sobre=$('sobre');if(sobre&&sobre.hidden!==busca){if(window.sagaRecolher)window.sagaRecolher(sobre,busca);else sobre.hidden=busca;}
  if(!busca&&FOTO){var f=FOTO;FOTO=null;restaurar(f);}
  // índice: só o que tem resultado (os capítulos recolhidos no índice se abrem durante a busca)
  document.querySelectorAll('#mnIndice .mn-ind-grupo').forEach(function(g){
    var id=g.dataset.grupo;g.hidden=busca&&!capComAlgo['cap-'+id];
    var lista=g.querySelector('.mn-ind-secs');if(lista)lista.hidden=busca?false:!!IND.grupos[id];
  });
  document.querySelectorAll('#mnIndice a.sec').forEach(function(a){a.hidden=busca&&fica[a.getAttribute('data-alvo')]===false;});
  ['sobre','cap-duvidas'].forEach(function(alvo){var a=document.querySelector('#mnIndice a[data-alvo="'+alvo+'"]');if(a)a.parentNode.hidden=busca&&(alvo==='sobre'||!capComAlgo[alvo]);});
  $('mnVazio').hidden=!(busca&&!n);
  $('mnResultado').textContent=busca?(n?n+(n===1?' parte encontrada':' partes encontradas'):''):'';
}

/* ---------- índice acompanha a leitura ---------- */
function ligarIndice(){
  if(!('IntersectionObserver' in window))return;
  var links={},caps={};
  document.querySelectorAll('#mnIndice a[data-alvo]').forEach(function(a){links[a.getAttribute('data-alvo')]=a;if(a.classList.contains('cap'))caps[a.getAttribute('data-alvo')]=a;});
  var chave=function(el){return el.classList.contains('mn-cap-cab')?el.parentNode.id:el.id;};
  var visiveis={};
  var obs=new IntersectionObserver(function(ent){
    ent.forEach(function(e){visiveis[chave(e.target)]=e.isIntersecting?e.target.getBoundingClientRect().top:undefined;});
    var melhor=null,topo=Infinity;Object.keys(visiveis).forEach(function(k){var v=visiveis[k];if(v!==undefined&&v<topo){topo=v;melhor=k;}});
    if(!melhor)return;
    var capAtual=melhor==='sobre'||melhor.indexOf('cap-')===0?melhor:(links[melhor]&&links[melhor].getAttribute('data-cap-de'));
    Object.keys(links).forEach(function(k){links[k].classList.toggle('active',k===melhor);});
    Object.keys(caps).forEach(function(k){caps[k].classList.toggle('atual',k===capAtual);});
    var a=links[melhor];if(a&&a.offsetParent){var ind=$('mnIndice');var r=a.getBoundingClientRect(),ri=ind.getBoundingClientRect();if(r.top<ri.top+30||r.bottom>ri.bottom-30)ind.scrollTop+=r.top-ri.top-ri.height/3;}
  },{rootMargin:'-70px 0px -65% 0px'});
  document.querySelectorAll('.mn-sec,#sobre,.mn-cap-cab').forEach(function(s){obs.observe(s);});
}

/* ---------- print ampliado ---------- */
function ampliar(src,alt){
  var z=document.createElement('div');z.className='mn-zoom';z.setAttribute('role','dialog');z.setAttribute('aria-label','Print ampliado');
  z.innerHTML='<img alt="'+esc(alt||'')+'" src="'+esc(src)+'"><button class="fechar" type="button" aria-label="Fechar">✕</button>';
  document.body.appendChild(z);
  var fechar=function(){document.removeEventListener('keydown',tecla);z.classList.remove('aberto');setTimeout(function(){z.remove();},semMov()?0:280);};
  var tecla=function(e){if(e.key==='Escape')fechar();};
  z.addEventListener('click',fechar);document.addEventListener('keydown',tecla);
  requestAnimationFrame(function(){requestAnimationFrame(function(){z.classList.add('aberto');});});
  z.querySelector('.fechar').focus();
}

function ligar(){
  $('mnBusca').addEventListener('input',function(){clearTimeout(tBusca);tBusca=setTimeout(buscar,140);});
  $('mnBusca').addEventListener('keydown',function(e){if(e.key==='Escape'){$('mnBusca').value='';buscar();}});
  $('mnLimpar').addEventListener('click',function(){$('mnBusca').value='';buscar();$('mnBusca').focus();});
  $('mnAbrirTudo').addEventListener('click',abrirTudo);
  $('mnFecharTudo').addEventListener('click',fecharTudo);
  $('mnIndice').addEventListener('click',function(e){
    var g=e.target.closest('[data-ind-grupo]');
    if(g){var id=g.getAttribute('data-ind-grupo');grupoIndice(id,!!IND.grupos[id],true);marcarBotaoGrupos();salvarPref();return;}
    var acao=e.target.closest('[data-ind]');
    if(acao&&acao.dataset.ind==='lado'){IND.recolhido=!IND.recolhido;aplicarLado();salvarPref();return;}
    if(acao&&acao.dataset.ind==='grupos'){
      var abrir=!Array.prototype.some.call(document.querySelectorAll('#mnIndice .mn-ind-grupo'),function(x){return !x.classList.contains('fechado');});
      document.querySelectorAll('#mnIndice .mn-ind-grupo').forEach(function(x){grupoIndice(x.dataset.grupo,abrir,true);});
      marcarBotaoGrupos();salvarPref();return;
    }
    var a=e.target.closest('a[data-alvo]');if(!a)return;e.preventDefault();ir(a.getAttribute('data-alvo'),true);
  });
  $('mnIr').addEventListener('change',function(){ir(this.value,true);});
  $('mnConteudo').addEventListener('click',function(e){
    var z=e.target.closest('[data-zoom]');if(z){var img=z.querySelector('img');ampliar(z.getAttribute('data-zoom'),img&&img.alt);return;}
    var pt=e.target.closest('[data-partes]');if(pt){partes(pt.closest('.mn-cap'),pt.dataset.partes==='abrir');return;}
    var cc=e.target.closest('.mn-cap-cab');if(cc){var cap=cc.parentNode;abrirBloco(cap,!estaAberto(cap),true);return;}
    var sc=e.target.closest('.mn-sec-cab');if(sc){var sec=sc.parentNode;abrirBloco(sec,!estaAberto(sec),true);}
  });
  $('btnSobre').addEventListener('click',function(){
    var c=$('sobreCorpo'),abrir=c.hidden;this.setAttribute('aria-expanded',abrir?'true':'false');this.textContent=abrir?'Fechar':'Sobre este POP';
    if(window.sagaRecolher)window.sagaRecolher(c,!abrir);else c.hidden=!abrir;
  });
  ligarIndiceLado();
}
function abrirNoLugar(){
  var alvo=null,qs=new URLSearchParams(location.search),tela=qs.get('tela');
  if(location.hash&&$(location.hash.slice(1)))alvo=location.hash.slice(1);
  else if(tela&&TELA_CAP[tela]){var t=TELA_CAP[tela];alvo=$(t)?t:('cap-'+t);}
  if(alvo&&$(alvo))setTimeout(function(){ir(alvo,false);},60);
}
async function init(){
  lerPref();montar();ligar();
  await SagaUI.carregar('manual');
  var s=await _sb.auth.getSession();if(!s.data||!s.data.session){location.href='login_padrao_metalico.html';return;}
  abrirNoLugar();ligarIndice();
}
init().catch(function(e){console.error(e);});
