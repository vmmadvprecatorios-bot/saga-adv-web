<style>
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
body{min-height:100vh;background:linear-gradient(160deg,var(--navy-1),var(--navy-2) 50%,var(--navy-3));color:var(--text);font-family:Montserrat,Arial,sans-serif;overflow-x:hidden}
.app{display:flex;position:relative;z-index:1}
.content{flex:1;padding:27px 28px 42px;min-width:0;min-height:calc(100vh - 64px)}
.overlay{display:none}.overlay.aberto{display:block}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;line-height:1.1}
.page-head p{color:var(--muted);font-size:12px;margin-top:4px;max-width:80ch}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:11px;font-size:12px;font-weight:700;border:1px solid var(--border-soft);background:var(--panel);transition:transform .15s,border-color .15s,background .15s}
.btn:hover{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--panel))}.btn:active{transform:scale(.96)}.btn:disabled{opacity:.45;cursor:default}
.btn-ouro{background:var(--gold);border-color:var(--gold);color:#fff}.btn-ouro:hover{background:var(--gold-light);border-color:var(--gold-light)}
a.btn{text-decoration:none;color:inherit}
.btn-sm{height:30px;padding:0 11px;font-size:11.5px;border-radius:9px}
html[data-cor="grafite"] body[data-theme="dark"] .btn-ouro,html[data-cor="grafite"] body[data-theme="dark"] .pill.active,html[data-cor="grafite"] body[data-theme="dark"] .tese-item.ativo .n{color:#1A1A1A}
.abas{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--border-soft);border-radius:12px;background:var(--panel);margin-bottom:16px;flex-wrap:wrap}
.pill{height:34px;padding:0 15px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted);transition:background .22s cubic-bezier(.22,.78,.25,1),color .22s}
.pill.active{background:var(--gold);color:#fff}.pill b{margin-left:6px;opacity:.85}
.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.busca{flex:1 1 240px;min-width:200px;height:38px;border-radius:11px;border:1px solid var(--border-soft);background:var(--panel);padding:0 13px;font-size:12.5px;outline:0}
.busca:focus,.sel:focus{border-color:var(--gold)}
.sel{height:38px;border-radius:11px;border:1px solid var(--border-soft);background:var(--panel);padding:0 10px;font-size:12px;outline:0;max-width:260px}
.vazio{padding:40px 16px;text-align:center;color:var(--muted);font-size:12.5px;border:1px dashed var(--border-soft);border-radius:14px}
.vazio b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}
.aba-pane{display:none}.aba-pane.ativo{display:block;animation:entra .32s cubic-bezier(.22,.78,.25,1)}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* atualizações */
.atu-grade{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.teses-lista{display:flex;flex-direction:column;gap:3px;padding:8px;border:1px solid var(--border-soft);border-radius:14px;background:var(--panel);position:sticky;top:80px;max-height:calc(100vh - 110px);overflow:auto}
.teses-tit{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 8px}
.tese-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;font-size:12.5px;text-align:left;color:var(--text);transition:background .2s}
.tese-item:hover{background:color-mix(in srgb,var(--gold) 8%,transparent)}
.tese-item.ativo{background:color-mix(in srgb,var(--gold) 16%,transparent);font-weight:700}
.tese-item .n{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:700}
.tese-item i{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:0 0 auto}
.posts{display:flex;flex-direction:column;gap:10px}
.post{border:1px solid var(--border-soft);border-radius:14px;background:var(--panel);padding:14px 16px;cursor:pointer;transition:border-color .2s,transform .2s cubic-bezier(.22,.78,.25,1),box-shadow .2s;position:relative}
.post:hover{border-color:color-mix(in srgb,var(--gold) 45%,transparent);transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,0,0,.14)}
.post.novo::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.post-topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.selo{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:700;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--text)}
.selo i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.etq-tese{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.marca-novo{font-size:10px;font-weight:800;color:var(--gold-light);letter-spacing:.6px;text-transform:uppercase}
.fixo{font-size:11px}
.post h3{font-size:15px;font-weight:700;line-height:1.3}
.post .previa{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .rodape{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:11px;color:var(--muted)}
.post .rodape .acoes{margin-left:auto;display:flex;gap:6px}
/* prateleira */
.prod-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.prod{border:1px solid var(--border-soft);border-radius:14px;background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.prod h3{font-size:15px;font-weight:700;line-height:1.3}
.prod .sub{font-size:11px;color:var(--muted)}
.prod .bloco b{display:block;font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.prod .bloco div{font-size:12.5px;line-height:1.5}
.prod .mais{display:none;flex-direction:column;gap:8px}.prod.aberto .mais{display:flex;animation:entra .3s cubic-bezier(.22,.78,.25,1)}
.prod .etqs{display:flex;flex-wrap:wrap;gap:4px}.prod .etqs span{font-size:10.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--border-soft);color:var(--muted)}
.prod .rodape{display:flex;gap:6px;align-items:center;margin-top:2px}
.lnk{color:var(--gold-light);font-size:11.5px;font-weight:600;text-decoration:underline;cursor:pointer}
/* radar */
.radar{display:flex;flex-direction:column;gap:10px}
.rad{border:1px solid var(--border-soft);border-radius:14px;background:var(--panel);padding:13px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px}
.rad h3{font-size:14px;font-weight:700}
.rad .meta{font-size:11px;color:var(--muted);margin-top:2px}
.rad .res{grid-column:1/-1;font-size:12.5px;line-height:1.5}
.rad .acoes{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;justify-content:flex-end}
/* janela */
.mo{position:fixed;inset:0;z-index:2500;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(6,10,20,.6);backdrop-filter:blur(3px)}
.mo.aberto{display:flex}
.md{width:100%;max-width:760px;max-height:calc(100vh - 36px);display:flex;flex-direction:column;border-radius:18px;background:var(--panel-solid);border:1px solid var(--border);box-shadow:var(--shadow)}
.md-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px 10px;border-bottom:1px solid var(--border-soft)}

.md-cab p{font-size:11.5px;color:var(--muted);margin-top:3px}
.md-x{width:30px;height:30px;border-radius:9px;border:1px solid var(--border-soft);color:var(--muted);flex:0 0 auto}
.md-corpo{padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.md-rod{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--border-soft);flex-wrap:wrap}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}.campo label{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700}
.campo input,.campo select,.campo textarea{border-radius:9px;border:1px solid var(--border-soft);background:var(--panel);padding:8px 10px;font-size:12.5px;outline:0;min-height:36px}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--gold)}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}.chk input{width:15px;height:15px;accent-color:var(--gold)}
.leitura .corpo{font-size:14px;line-height:1.7}.leitura .corpo p{margin:0 0 10px;text-align:justify}.leitura .corpo ul,.leitura .corpo ol{margin:0 0 10px 22px}
.leitura .meta{font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 14px;border-radius:11px;background:var(--panel-solid);border:1px solid var(--border);box-shadow:var(--shadow);font-size:12px;max-width:360px}
.opc-linha{display:flex;align-items:center;gap:8px;margin-bottom:6px}.opc-linha input[type=text]{flex:1;min-width:0;height:32px;border-radius:8px;border:1px solid var(--border-soft);background:var(--panel);padding:0 9px;font-size:12px}.opc-linha input[type=color]{width:32px;height:30px;border:1px solid var(--border-soft);border-radius:7px;background:none;padding:0}
@media(max-width:860px){.content{padding:18px 14px 34px}.page-head h1{font-size:27px}.atu-grade{grid-template-columns:1fr}.teses-lista{position:static;flex-direction:row;overflow-x:auto;max-height:none}.teses-tit{display:none}.tese-item{flex:0 0 auto}.grade2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* =====================================================================
   SAGA · Teses e oportunidades (bloco 110)
   Atualizações de teses (blog interno da equipe), Prateleira de produtos jurídicos e Radar de oportunidades.
   ===================================================================== */
var T={aba:'atualizacoes',pode:false,admin:false,eu:null,teses:[],areas:[],cat:[],posts:[],lidos:{},produtos:[],radar:[],tese:'',sit:'',busca:'',prodSit:'',area:'',buscaProd:'',radarSt:'novo',buscaRadar:'',pessoas:{}};
var RADAR_ST=[['novo','Novos'],['analise','Em análise'],['incorporado','Incorporados'],['descartado','Descartados']];
function $(id){return document.getElementById(id);}
function esc(v){var d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML;}
function toast(msg){var w=$('toastWrap');var t=document.createElement('div');t.className='toast';t.innerHTML=msg;w.appendChild(t);setTimeout(function(){t.remove();},4500);}
function norm(v){return String(v==null?'':v).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function dataBR(iso){if(!iso)return '';var d=new Date(iso.length===10?iso+'T12:00:00':iso);return d.toLocaleDateString('pt-BR');}
function puro(v){v=String(v||'').replace(/<\/(p|li|div|h\d)>|<br\s*\/?>/gi,' $&');return (window.SagaTexto?SagaTexto.puro(v):v.replace(/<[^>]*>/g,' ')).replace(/\s+/g,' ').trim();}
function semMov(){try{return localStorage.getItem('saga-movimento')==='reduzido';}catch(e){return false;}}
function abrir(id){$(id).classList.add('aberto');var md=$(id).querySelector('.md');if(md&&md.animate&&!semMov())md.animate([{opacity:0,transform:'translateY(10px) scale(.98)'},{opacity:1,transform:'none'}],{duration:260,easing:'cubic-bezier(.22,.78,.25,1)'});}
function fechar(id){var m=$(id),md=m.querySelector('.md');if(md&&md.animate&&!semMov()){var a=md.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(8px) scale(.98)'}],{duration:200,easing:'cubic-bezier(.22,.78,.25,1)'});a.onfinish=function(){m.classList.remove('aberto');};}else m.classList.remove('aberto');}
function opcoes(cat){return T.cat.filter(function(c){return c.categoria===cat&&c.ativo;}).sort(function(a,b){return (a.ordem||0)-(b.ordem||0);});}
function catPorId(id){return T.cat.find(function(c){return c.id===id;});}
function nomeTese(id){var t=T.teses.find(function(x){return x.id===id;});return t?t.nome:'';}
function nomeArea(id){var a=T.areas.find(function(x){return x.id===id;});return a?a.nome:'';}
function selo(c){return c?'<span class="selo" style="--c:'+esc(c.cor||'#8a94a8')+'"><i></i>'+esc(c.nome)+'</span>':'';}
function nomePessoa(id){var p=(T.pessoas[id]||'').trim().split(/\s+/).filter(Boolean);return p.length>1?p[0]+' '+p[p.length-1]:(p[0]||'');}

/* ---------- dados ---------- */
async function carregarTudo(){
  var r=await Promise.all([
    _sb.from('teses').select('id,nome,ativo,area_direito_id').order('nome'),
    _sb.from('areas_direito').select('id,nome,ativo,ordem').order('ordem'),
    _sb.from('etiquetas_catalogo').select('id,nome,cor,categoria,ordem,ativo').in('categoria',['tese_situacao','produto_situacao']),
    _sb.from('teses_atualizacoes').select('id,tese_id,situacao_id,titulo,corpo,link,fixada,ativo,autor_id,criado_em,atualizado_em').order('criado_em',{ascending:false}).limit(2000),
    _sb.from('teses_leituras').select('atualizacao_id').eq('usuario_id',T.eu||''),
    _sb.from('produtos_juridicos').select('*').order('ordem').order('nome'),
    _sb.from('radar_oportunidades').select('*').order('criado_em',{ascending:false}).limit(1000),
    _sb.from('usuarios').select('id,nome_completo')
  ]);
  T.teses=(r[0].data||[]).filter(function(t){return t.ativo!==false;});T.areas=(r[1].data||[]).filter(function(a){return a.ativo!==false;});
  T.cat=r[2].data||[];T.posts=r[3].data||[];T.lidos={};(r[4].data||[]).forEach(function(l){T.lidos[l.atualizacao_id]=1;});
  T.produtos=r[5].data||[];T.radar=r[6].data||[];(r[7].data||[]).forEach(function(u){T.pessoas[u.id]=u.nome_completo||'';});
  montarFiltros();desenharTudo();
}
function montarFiltros(){
  $('filtroSit').innerHTML='<option value="">Todas as situações</option>'+opcoes('tese_situacao').map(function(c){return '<option value="'+c.id+'">'+esc(c.nome)+'</option>';}).join('');$('filtroSit').value=T.sit;
  $('filtroProdSit').innerHTML='<option value="">Todas as situações</option>'+opcoes('produto_situacao').map(function(c){return '<option value="'+c.id+'">'+esc(c.nome)+'</option>';}).join('');$('filtroProdSit').value=T.prodSit;
  $('filtroArea').innerHTML='<option value="">Todas as áreas</option>'+T.areas.map(function(a){return '<option value="'+a.id+'">'+esc(a.nome)+'</option>';}).join('');$('filtroArea').value=T.area;
}
function desenharTudo(){desenharBotoes();desenharTeses();desenharPosts();desenharProdutos();desenharRadar();}

/* ---------- topo ---------- */
function desenharBotoes(){
  var b='';
  if(T.pode){
    if(T.aba==='atualizacoes')b='<button class="btn btn-ouro" type="button" id="btnNovo">+ Nova atualização</button>';
    else if(T.aba==='prateleira')b='<button class="btn btn-ouro" type="button" id="btnNovo">+ Novo produto</button>';
    else b='<button class="btn btn-ouro" type="button" id="btnNovo">+ Novo informativo</button>';
    if(T.admin&&T.aba!=='radar')b='<button class="btn" type="button" id="btnOpcoes">Organizar situações</button>'+b;
  }
  $('botoesTopo').innerHTML=b;
  var n=$('btnNovo');if(n)n.onclick=function(){if(T.aba==='atualizacoes')formPost(null);else if(T.aba==='prateleira')formProduto(null);else formRadar(null);};
  var o=$('btnOpcoes');if(o)o.onclick=function(){organizarOpcoes(T.aba==='atualizacoes'?'tese_situacao':'produto_situacao');};
  var novas=T.posts.filter(function(p){return p.ativo&&!T.lidos[p.id]&&p.autor_id!==T.eu;}).length;
  $('qtdNovas').hidden=!novas;$('qtdNovas').textContent=novas;
  var nr=T.radar.filter(function(r){return r.status==='novo';}).length;$('qtdRadar').hidden=!nr;$('qtdRadar').textContent=nr;
}

/* ---------- atualizações de teses ---------- */
function postsVisiveis(){return T.posts.filter(function(p){return p.ativo||T.pode;});}
function desenharTeses(){
  var vis=postsVisiveis(),cont={},novos={};
  vis.forEach(function(p){var k=p.tese_id||'__geral';cont[k]=(cont[k]||0)+1;if(!T.lidos[p.id]&&p.autor_id!==T.eu&&p.ativo)novos[k]=1;});

function organizarOpcoes(cat){
  var lista=T.cat.filter(function(c){return c.categoria===cat;}).sort(function(a,b){return (a.ordem||0)-(b.ordem||0);});
  $('mdForm').innerHTML='<div class="md-cab"><div><h2>Organizar situações</h2><p>Renomeie, troque a cor, mude a ordem ou desative (o que já foi usado continua no histórico).</p></div><button class="md-x" type="button" data-fechar="moForm" aria-label="Fechar">✕</button></div>'+
    '<div class="md-corpo" id="opcLista">'+lista.map(function(c,i){return '<div class="opc-linha" data-opc="'+c.id+'"><input type="color" value="'+esc(c.cor||'#8a94a8')+'"><input type="text" value="'+esc(c.nome)+'" maxlength="60"><button class="btn btn-sm" type="button" data-sobe'+(i?'':' disabled')+'>↑</button><button class="btn btn-sm" type="button" data-desce'+(i<lista.length-1?'':' disabled')+'>↓</button><label class="chk"><input type="checkbox"'+(c.ativo?' checked':'')+'> Ativa</label></div>';}).join('')+
    '<div class="opc-linha"><input type="text" id="opcNova" placeholder="Nova opção" maxlength="60"><button class="btn btn-sm" type="button" id="opcAdd">Adicionar</button></div></div>'+
    '<div class="md-rod"><button class="btn" type="button" data-fechar="moForm">Fechar</button><button class="btn btn-ouro" type="button" id="opcSalvar">Salvar</button></div>';
  var box=$('opcLista');
  box.addEventListener('click',function(e){var l=e.target.closest('.opc-linha');if(!l)return;
    if(e.target.closest('[data-sobe]')&&l.previousElementSibling)l.parentNode.insertBefore(l,l.previousElementSibling);
    if(e.target.closest('[data-desce]')&&l.nextElementSibling&&l.nextElementSibling.dataset.opc)l.parentNode.insertBefore(l.nextElementSibling,l);
    box.querySelectorAll('[data-opc]').forEach(function(x,i,arr){x.querySelector('[data-sobe]').disabled=!i;x.querySelector('[data-desce]').disabled=i===arr.length-1;});});
  $('opcAdd').onclick=async function(){var n=$('opcNova').value.trim();if(!n)return;var r=await _sb.from('etiquetas_catalogo').insert({categoria:cat,nome:n,cor:'#8a94a8',ordem:lista.length+1}).select('id,nome,cor,categoria,ordem,ativo').single();if(r.error){toast(esc(r.error.message));return;}T.cat.push(r.data);organizarOpcoes(cat);};
  abrir('moForm');
  $('opcSalvar').onclick=async function(){
    var linhas=box.querySelectorAll('[data-opc]'),erro=null;this.disabled=true;
    for(var i=0;i<linhas.length;i++){var l=linhas[i],ins=l.querySelectorAll('input');var r=await _sb.from('etiquetas_catalogo').update({cor:ins[0].value,nome:ins[1].value.trim()||'Sem nome',ordem:i+1,ativo:ins[2].checked}).eq('id',l.dataset.opc);if(r.error)erro=r.error;}
    this.disabled=false;if(erro){toast('Não foi possível salvar: '+esc(erro.message));return;}fechar('moForm');toast('Situações atualizadas.');carregarTudo();
  };
}

/* ---------- eventos ---------- */
function trocarAba(a){
  T.aba=a;document.querySelectorAll('#abas [data-aba]').forEach(function(b){b.classList.toggle('active',b.dataset.aba===a);});
  document.querySelectorAll('.aba-pane').forEach(function(p){p.classList.toggle('ativo',p.id==='aba-'+a);});
  try{var u=new URL(location.href);u.searchParams.set('aba',a);u.searchParams.delete('post');history.replaceState(history.state,'',u);}catch(e){}
  desenharBotoes();
}
function ligar(){
  $('abas').addEventListener('click',function(e){var b=e.target.closest('[data-aba]');if(b)trocarAba(b.dataset.aba);});
  $('tesesLista').addEventListener('click',function(e){var b=e.target.closest('[data-tese]');if(!b)return;T.tese=b.dataset.tese;desenharTeses();desenharPosts();});
  $('posts').addEventListener('click',function(e){var ed=e.target.closest('[data-editar]');if(ed){e.stopPropagation();formPost(ed.dataset.editar);return;}var p=e.target.closest('[data-post]');if(p)lerPost(p.dataset.post);});
  $('posts').addEventListener('keydown',function(e){if(e.key==='Enter'){var p=e.target.closest('[data-post]');if(p)lerPost(p.dataset.post);}});
  $('mdLer').addEventListener('click',function(e){var ed=e.target.closest('[data-editar]');if(ed){fechar('moLer');setTimeout(function(){formPost(ed.dataset.editar);},220);}});
  var tm;function deb(fn){return function(){var v=this.value;clearTimeout(tm);tm=setTimeout(function(){fn(v);},180);};}
  $('buscaAtu').addEventListener('input',deb(function(v){T.busca=v;desenharPosts();}));
  $('filtroSit').addEventListener('change',function(){T.sit=this.value;desenharPosts();});
  $('buscaProd').addEventListener('input',deb(function(v){T.buscaProd=v;desenharProdutos();}));
  $('filtroProdSit').addEventListener('change',function(){T.prodSit=this.value;desenharProdutos();});
  $('filtroArea').addEventListener('change',function(){T.area=this.value;desenharProdutos();});
  $('produtos').addEventListener('click',function(e){var v=e.target.closest('[data-vermais]');if(v){var c=v.closest('.prod');c.classList.toggle('aberto');v.textContent=c.classList.contains('aberto')?'Ver menos':'Ver tudo';return;}var ed=e.target.closest('[data-editar-prod]');if(ed)formProduto(ed.dataset.editarProd);});
  $('radarStatus').addEventListener('click',function(e){var b=e.target.closest('[data-radar-st]');if(b){T.radarSt=b.dataset.radarSt;desenharRadar();}});
  $('buscaRadar').addEventListener('input',deb(function(v){T.buscaRadar=v;desenharRadar();}));
  $('radar').addEventListener('click',async function(e){
    var st=e.target.closest('[data-rad-st]');if(st){var r=await _sb.from('radar_oportunidades').update({status:st.dataset.radSt}).eq('id',st.dataset.rad);if(r.error){toast(esc(r.error.message));return;}carregarTudo();return;}
    var inc=e.target.closest('[data-rad-inc]');if(inc){var it=T.radar.find(function(x){return x.id===inc.dataset.radInc;});formProduto(null,{nome:it.titulo,resumo:it.resumo,fundamento:[it.fonte,it.link].filter(Boolean).join(' · '),radarId:it.id});return;}
    var ed=e.target.closest('[data-rad-edit]');if(ed)formRadar(ed.dataset.radEdit);
  });
  document.addEventListener('click',function(e){var f=e.target.closest('[data-fechar]');if(f)fechar(f.dataset.fechar);});
  document.querySelectorAll('.mo').forEach(function(m){m.addEventListener('click',function(e){if(e.target===m)fechar(m.id);});});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')document.querySelectorAll('.mo.aberto').forEach(function(m){fechar(m.id);});});
  document.addEventListener('saga-atualizar',carregarTudo);
}
async function init(){
  ligar();
  await SagaUI.carregar('teses');
  var s=await _sb.auth.getSession();if(!s.data||!s.data.session){location.href='login_padrao_metalico.html';return;}
  var r=await Promise.all([_sb.from('usuarios').select('id').eq('auth_user_id',s.data.session.user.id).maybeSingle(),_sb.rpc('pode_publicar_teses'),_sb.rpc('eh_admin_sistema')]);
  T.eu=r[0].data&&r[0].data.id;T.pode=r[1].data===true;T.admin=r[2].data===true;
  var q=new URLSearchParams(location.search);var a=q.get('aba');if(a&&$('aba-'+a))trocarAba(a);
  await carregarTudo();
  var post=q.get('post');if(post){trocarAba('atualizacoes');lerPost(post);}
}
init().catch(function(e){toast('Erro ao abrir: '+esc(e.message||''));});
</script>
