<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
body{min-height:100vh;background:linear-gradient(160deg,var(--navy-1),var(--navy-2) 50%,var(--navy-3));color:var(--text);font-family:Montserrat,Arial,sans-serif;overflow-x:hidden}
.app{display:flex;position:relative;z-index:1}
.content{flex:1;padding:22px 24px 34px;min-width:0;min-height:calc(100vh - 64px);display:flex;flex-direction:column}
.overlay{display:none}.overlay.aberto{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:10px;font-size:12px;border:1px solid var(--border-soft);background:var(--panel);transition:transform .15s,border-color .15s,background .15s,opacity .2s;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--gold) 45%,var(--border-soft))}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.42;cursor:default;transform:none}
.btn-ouro{border-color:color-mix(in srgb,var(--gold) 55%,transparent);background:color-mix(in srgb,var(--gold) 14%,var(--panel))}
.btn-perigo{color:var(--danger,#e5484d);border-color:color-mix(in srgb,var(--danger,#e5484d) 45%,transparent)}
.btn.ativo{background:color-mix(in srgb,var(--gold) 16%,var(--panel));border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
/* 23/11 (Dr. Victor): editor em TELA INTEIRA, com Voltar sempre à vista e cara de planilha de verdade */
html,body{height:100%}
body{overflow:hidden}
.app{height:100%}
.content{padding:10px 14px 8px;height:100vh;height:100dvh;min-height:0;gap:6px}
.btn.ic{min-width:30px;padding:0 7px}
.btn svg{flex:none}
/* cabeçalho do documento */
.pl-topo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:none}
.pl-voltar{height:34px;padding:0 12px 0 8px;border-color:color-mix(in srgb,var(--gold) 45%,var(--border-soft))}
.pl-nome{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.pl-nome input{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;line-height:1.15;background:transparent;border:1px solid transparent;border-radius:8px;padding:0 6px;margin-left:-6px;width:100%;max-width:720px;outline:0}
.pl-nome input:hover{border-color:var(--border-soft)}.pl-nome input:focus{border-color:var(--gold)}
.pl-info{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.pl-chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--border-soft);border-radius:999px;padding:1px 9px;background:var(--panel);color:var(--text);text-decoration:none}
.pl-chip.salvo{color:var(--muted)}.pl-chip.pendente{border-color:color-mix(in srgb,var(--warning,#d97706) 55%,transparent);color:var(--text)}
.pl-acoes{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* avisos (erros sempre à vista) */
#plAvisos{display:flex;flex-direction:column;gap:6px;flex:none;max-height:26vh;overflow:auto}
#plAvisos:empty{display:none}
.aviso{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:8px 12px;border-radius:12px;font-size:12.5px;line-height:1.5;border:1px solid}
.aviso b{display:block;margin-bottom:2px}
.aviso.erro{border-color:color-mix(in srgb,var(--danger,#e5484d) 55%,transparent);background:color-mix(in srgb,var(--danger,#e5484d) 9%,transparent)}
.aviso.atencao{border-color:color-mix(in srgb,var(--warning,#d97706) 55%,transparent);background:color-mix(in srgb,var(--warning,#d97706) 9%,transparent)}
.aviso ul{margin:4px 0 0 18px}.aviso li{margin:2px 0}
.aviso a,.aviso .lnk,.lnk{color:var(--gold);text-decoration:underline;cursor:pointer;background:none;border:0;font:inherit;padding:0}
/* barra de ferramentas (uma linha; no celular rola para o lado) */
.pl-ferr{display:flex;gap:4px;align-items:center;padding:5px 6px;border:1px solid var(--border-soft);border-radius:12px 12px 0 0;background:var(--panel);flex:none;overflow-x:auto;scrollbar-width:thin}
.pl-ferr .sep{width:1px;height:20px;background:var(--border-soft);margin:0 3px;flex:none}
.pl-ferr select{height:28px;border-radius:8px;border:1px solid var(--border-soft);background:var(--panel);padding:0 6px;font-size:11.5px;flex:none}
.pl-ferr .btn{height:28px;padding:0 8px;flex:none;font-size:11.5px}
.pl-ferr .btn.ic{padding:0 6px}
.pl-letra{display:inline-flex;flex-direction:column;align-items:center;font-weight:700;line-height:1;font-size:12px}
.pl-letra i{display:block;width:13px;height:3px;border-radius:2px;margin-top:2px;background:var(--text)}
.pl-barra{display:flex;align-items:stretch;border:1px solid var(--border-soft);border-top:0;background:var(--panel);flex:none}
.pl-barra .end{width:92px;flex:none;height:30px;border:0;border-right:1px solid var(--border-soft);background:transparent;text-align:center;font-size:12px;font-weight:600;font-variant-numeric:lining-nums tabular-nums;outline:0;padding:0 4px}
.pl-barra .end:focus{background:color-mix(in srgb,var(--gold) 9%,transparent)}
.pl-barra .fx{width:30px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-style:italic;font-size:12px;border-right:1px solid var(--border-soft)}
.pl-barra input#plFx{flex:1;min-width:0;height:30px;border:0;background:transparent;padding:0 10px;font-size:12.5px;outline:0;font-family:ui-monospace,Menlo,Consolas,monospace}
/* grade: só o que aparece é desenhado (camadas) */
.pl-grade-caixa{position:relative;flex:1 1 auto;min-height:160px;overflow:auto;border:1px solid var(--border-soft);border-top:0;background:var(--panel-solid);overscroll-behavior:contain;outline:0;--pl-bg:var(--panel-solid);--pl-linha:color-mix(in srgb,var(--text) 11%,transparent)}
.pl-grade-caixa:focus-visible .pl-vista{outline:2px solid color-mix(in srgb,var(--gold) 40%,transparent);outline-offset:-2px}
.pl-vista{position:sticky;top:0;left:0;overflow:hidden;z-index:1;font-size:12.5px;user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y}
.pl-espaco{pointer-events:none}
.pl-clip{position:absolute;overflow:hidden}
.pl-in{position:absolute;left:0;top:0;will-change:transform}
#vTopo,#vEsq,#vCanto{background:var(--pl-bg);z-index:2}
#vCanto{z-index:3}
.pl-hc,.pl-hl{background:color-mix(in srgb,var(--text) 4%,var(--pl-bg));z-index:4}
.pl-cantinho{position:absolute;z-index:5;background:color-mix(in srgb,var(--text) 6%,var(--pl-bg));border-right:1px solid var(--pl-linha);border-bottom:1px solid var(--pl-linha);cursor:cell}
.pl-cantinho::after{content:"";position:absolute;right:3px;bottom:3px;border-left:8px solid transparent;border-bottom:8px solid color-mix(in srgb,var(--muted) 60%,transparent)}
.hc,.hl{position:absolute;color:var(--muted);font-size:.86em;font-weight:500;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--pl-linha);border-bottom:1px solid var(--pl-linha);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;overflow:hidden}
.hc{top:0;height:100%}.hl{left:0;width:100%}
.hc.sel,.hl.sel{color:var(--text);font-weight:700;background:color-mix(in srgb,var(--gold) 18%,transparent)}
.hl.filtrada{color:var(--gold)}
.pl-linha-cong{position:absolute;z-index:6;background:color-mix(in srgb,var(--gold) 60%,var(--border-soft));pointer-events:none}
.pl-lc-h{left:0;right:0;height:2px}.pl-lc-v{top:0;bottom:0;width:2px}
.c{position:absolute;box-sizing:border-box;border-right:1px solid var(--pl-linha);border-bottom:1px solid var(--pl-linha);padding:0 5px;white-space:nowrap;overflow:hidden;line-height:1.2;display:flex;align-items:center;font-variant-numeric:lining-nums tabular-nums;cursor:cell}
.c.n{justify-content:flex-end}
.c.al-esq{justify-content:flex-start}.c.al-centro{justify-content:center;text-align:center}.c.al-dir{justify-content:flex-end;text-align:right}
.c.b{font-weight:700}.c.i{font-style:italic}
.c.quebra{white-space:pre-wrap;align-items:flex-start;padding-top:3px;word-break:break-word}
.c.ov{z-index:1;background:var(--pl-bg)}
.c.erro{color:var(--danger,#e5484d);font-weight:600}
.c.bd{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 38%,transparent)}
#plVista .c.f-titulo{background:color-mix(in srgb,var(--gold) 22%,var(--pl-bg));font-weight:700}
#plVista .c.f-secao{background:color-mix(in srgb,var(--gold) 10%,var(--pl-bg));font-weight:600}
#plVista .c.f-entrada{background:color-mix(in srgb,#eab308 13%,var(--pl-bg))}
#plVista .c.f-total{background:color-mix(in srgb,var(--gold) 15%,var(--pl-bg));font-weight:700}
#plVista .c.f-aviso{background:color-mix(in srgb,#e5484d 11%,var(--pl-bg))}
#plVista .c.f-ok{background:color-mix(in srgb,#16a34a 12%,var(--pl-bg))}
#plVista .c.f-cinza{color:var(--muted);font-size:.88em}
.c .nota{position:absolute;top:0;right:0;width:0;height:0;border-top:7px solid #d97706;border-left:7px solid transparent}
.c .nota.conferir{border-top-color:#e5484d}
.pl-sel{position:absolute;left:0;top:0;pointer-events:none;z-index:3}
.pl-sel>div{position:absolute;box-sizing:border-box}
.pl-selbox{background:color-mix(in srgb,var(--gold) 13%,transparent);border:1px solid color-mix(in srgb,var(--gold) 70%,transparent)}
.pl-ativa{border:2px solid var(--gold)}
.pl-alca{width:8px;height:8px;background:var(--gold);border:1.5px solid var(--pl-bg);border-radius:2px;pointer-events:auto;cursor:crosshair;z-index:2}
.pl-prev{border:1.5px dashed var(--gold)}
.pl-refbox{border:1.5px dashed #2f6fd6;background:color-mix(in srgb,#2f6fd6 9%,transparent)}
.pl-formiga{border:1.5px dashed var(--gold);animation:plFormiga 1s linear infinite}
@keyframes plFormiga{50%{border-color:color-mix(in srgb,var(--gold) 35%,transparent)}}
html[data-movimento="reduzido"] .pl-formiga{animation:none}
.pl-fbtn{position:absolute;z-index:2;width:17px;height:17px;border-radius:4px;border:1px solid var(--border-soft);background:var(--panel);font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:0}
.pl-fbtn.on{color:var(--text);border-color:var(--gold);background:color-mix(in srgb,var(--gold) 20%,var(--panel))}
.pl-ed{position:absolute;z-index:8;border:2px solid var(--gold);background:var(--panel-solid);color:var(--text);font:12.5px ui-monospace,Menlo,Consolas,monospace;line-height:1.35;padding:2px 5px;outline:0;resize:none;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:pre}
/* abas e barra de baixo */
.pl-pe{display:flex;align-items:center;gap:8px;border:1px solid var(--border-soft);border-top:0;border-radius:0 0 12px 12px;background:var(--panel);flex:none;min-width:0;flex-wrap:wrap;padding:4px 6px}
.pl-abas{display:flex;gap:4px;align-items:center;flex:1 1 260px;min-width:0;overflow-x:auto;scrollbar-width:thin}
.pl-aba{height:26px;padding:0 11px;border-radius:8px;font-size:12px;color:var(--muted);border:1px solid transparent;white-space:nowrap;flex:none;transition:background .2s cubic-bezier(.22,.78,.25,1),color .2s}
.pl-aba.active{color:var(--text);background:color-mix(in srgb,var(--gold) 14%,transparent);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.pl-aba .err{display:inline-block;margin-left:6px;font-size:10px;color:var(--danger,#e5484d)}
.pl-abas .btn{height:26px;flex:none}
.pl-status{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-left:auto}
.pl-status b{color:var(--text);font-variant-numeric:lining-nums tabular-nums}
.pl-zoom{display:inline-flex;gap:3px;align-items:center}
.pl-zoom select{height:24px;border-radius:7px;border:1px solid var(--border-soft);background:var(--panel);font-size:11px;padding:0 4px}
.pl-zoom .btn{height:24px;min-width:24px;padding:0}
/* menus pequenos */
.pl-pop{position:fixed;z-index:2600;min-width:200px;max-width:min(340px,calc(100vw - 16px));max-height:min(70vh,520px);overflow:auto;padding:5px;border-radius:12px;background:var(--panel-solid);border:1px solid var(--border);box-shadow:var(--shadow,0 12px 30px rgba(0,0,0,.3));opacity:0;transform:translateY(-4px);transition:opacity .2s cubic-bezier(.22,.78,.25,1),transform .24s cubic-bezier(.22,.78,.25,1)}
.pl-pop.aberto{opacity:1;transform:none}
html[data-movimento="reduzido"] .pl-pop{transition:none}
.pl-pop-it{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:8px;font-size:12.5px}
.pl-pop-it:hover,.pl-pop-it:focus-visible{background:color-mix(in srgb,var(--gold) 12%,transparent);outline:0}
.pl-pop-it[disabled]{opacity:.45;cursor:default;background:none}
.pl-pop-it small{margin-left:auto;color:var(--muted);font-size:10.5px}
.pl-pop-sep{height:1px;background:var(--border-soft);margin:4px 2px}
.pl-pop-tit{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 9px 3px}
.pl-amostra{width:16px;height:16px;border-radius:5px;border:1px solid var(--border-soft);flex:none}
.pl-fpop{display:flex;flex-direction:column;gap:7px;padding:4px;min-width:240px}
.pl-fpop .campo{height:32px;border-radius:9px;border:1px solid var(--border-soft);background:var(--panel);padding:0 9px;font-size:12px;outline:0}
.pl-fpop-ord{display:flex;gap:5px}.pl-fpop-ord .btn{height:28px;flex:1}
.pl-fpop-tudo{display:flex;gap:7px;align-items:center;font-size:12px;font-weight:600}
.pl-fpop-lista{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto;border:1px solid var(--border-soft);border-radius:9px;padding:5px}
.pl-fpop-lista label{display:flex;gap:7px;align-items:center;font-size:12px;padding:2px 3px}
.pl-fpop-lista label span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-fpop-lista small{color:var(--muted)}
.pl-fpop-rod{display:flex;justify-content:flex-end;gap:6px}
.pl-fpop-rod .btn{height:30px}
.pl-fpop .dica{font-size:11px;color:var(--muted)}
/* janelas (formulário no meio da tela) */
.mo{position:fixed;inset:0;z-index:2500;display:flex;align-items:safe center;justify-content:center;padding:18px;background:rgba(6,10,20,.6);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .26s cubic-bezier(.22,.78,.25,1),visibility 0s linear .26s;overflow-y:auto}
.mo.aberto{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .26s cubic-bezier(.22,.78,.25,1),visibility 0s}
.md{width:100%;max-width:560px;display:flex;flex-direction:column;border-radius:18px;background:var(--panel-solid);border:1px solid var(--border);box-shadow:var(--shadow);transform:translateY(10px) scale(.985);transition:transform .34s cubic-bezier(.22,.78,.25,1);max-height:100%;backdrop-filter:blur(3px)}
.mo.aberto .md{transform:none}
html[data-movimento="reduzido"] .mo,html[data-movimento="reduzido"] .md{transition:none}
.md-cab{padding:16px 18px 10px;border-bottom:1px solid var(--border-soft)}
.md-cab h2{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600}
.md-cab p{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.md-corpo{padding:14px 18px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.md-corpo label.rot{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600}
.md-corpo .campo{height:36px;border-radius:10px;border:1px solid var(--border-soft);background:var(--panel);padding:0 10px;font-size:12.5px;outline:0;min-width:0;width:100%}
.md-corpo .campo:focus{border-color:var(--gold)}
.md-corpo textarea.campo{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
.md-corpo .dica{font-size:11.5px;color:var(--muted);line-height:1.5}
.md-corpo .erro-campo{font-size:12px;color:var(--danger,#e5484d);line-height:1.5}
.md-corpo .erro-campo:empty{display:none}
.md-rod{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:10px 18px 16px;border-top:1px solid var(--border-soft)}
.pills{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--border-soft);border-radius:11px;background:var(--panel);flex-wrap:wrap}
.pill{height:30px;padding:0 12px;border-radius:8px;font-size:11.5px;font-weight:500;color:var(--muted);border:1px solid transparent;transition:background .2s cubic-bezier(.22,.78,.25,1),color .2s}
.pill.active{color:var(--text);background:color-mix(in srgb,var(--gold) 14%,transparent);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.lista-versoes{display:flex;flex-direction:column;gap:6px}
.lista-versoes .v{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--border-soft);border-radius:10px;padding:8px 10px;font-size:12px}
.lista-versoes .v small{color:var(--muted)}
.marcar-abas{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.marcar-abas label{display:flex;gap:8px;align-items:center}
.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 14px;border-radius:11px;background:var(--panel-solid);border:1px solid var(--border);box-shadow:var(--shadow);font-size:12px;max-width:380px;line-height:1.5}
.toast.success{border-color:color-mix(in srgb,#16a34a 50%,var(--border))}.toast.error{border-color:color-mix(in srgb,#e5484d 60%,var(--border))}
.pl-carregando{padding:40px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:760px){
  .content{padding:8px 8px 6px}
  .pl-nome input{font-size:19px}
  .pl-acoes .some-cel{display:none}
  .pl-voltar span{display:none}
  .pl-voltar{padding:0 8px}
  .pl-ferr .btn span{display:none}
  .pl-status{margin-left:0;font-size:11px;gap:8px}
  .pl-barra .end{width:74px}
  .pl-info .pl-chip:not(.salvo):not(.pendente){display:none}
}
